<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reef Aquarium</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  body.idle, body.idle canvas { cursor: none; }
  body.idle #toolbar, body.idle #toolbar *, body.idle #panel, body.idle #panel * { cursor: auto; }
  #hud { display: none; position: fixed; left: 12px; top: 10px; z-index: 1; font: 12px/1.4 ui-monospace, Consolas, monospace; color: #cfe; text-shadow: 0 0 3px #000; pointer-events: none; }
  #toolbar { position: fixed; top: 10px; right: 12px; z-index: 2; display: flex; gap: 8px; }
  #toolbar button { padding: 6px 12px; border: 1px solid #e5e1d822; border-radius: 8px; background: #0b0f1488;
                    color: #e5e1d8; font: 12px/1.3 system-ui, sans-serif; cursor: pointer; backdrop-filter: blur(6px);
                    opacity: .38; transition: opacity .15s ease, background .15s ease; }
  #toolbar button:hover, #toolbar button:focus-visible { opacity: 1; background: #18222ce6; }
  #toolbar button:focus-visible { outline: 2px solid #e2a04e; outline-offset: 2px; }
  #sound::before { content: '♪'; display: inline-block; width: 16px; opacity: .7; }
  #sound.on, #settings.on { border-color: #e2a04eaa; opacity: 1; }
  #sound.on::before { opacity: 1; }
  #panel { position: fixed; z-index: 3; right: 12px; top: 50px; width: 330px; max-height: calc(100vh - 60px);
           display: flex; flex-direction: column; overflow: hidden; border-radius: 8px;
           background: #0b0f14c8; backdrop-filter: blur(6px); color: #e5e1d8; font: 12px/1.3 system-ui, sans-serif; }
  #panel.hidden { display: none; }
  #panel .panel-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px;
                      padding: 8px 8px 8px 12px; border-bottom: 1px solid #e5e1d822; }
  #panel .panel-bar span { font: 650 12px/1.2 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
  #close-settings { width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent;
                    color: inherit; font: 20px/1 system-ui, sans-serif; cursor: pointer; }
  #close-settings:hover { background: #18222ce6; }
  #close-settings:focus-visible { outline: 2px solid #e2a04e; outline-offset: 2px; }
  #panel-body { overflow: auto; min-height: 0; padding: 8px 12px 10px; }
  #panel .section-toggle, #panel .group-toggle { display: flex; width: 100%; align-items: center; gap: 8px;
              padding: 0; border: 0; background: transparent; color: inherit; text-align: left; cursor: pointer; }
  #panel .section-toggle { margin: 10px 0 0; padding-top: 8px; border-top: 1px solid #e5e1d822;
                           font: 650 12px/1.2 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
  #panel .section:first-child .section-toggle { margin-top: 0; padding-top: 0; border-top: 0; }
  #panel .group-toggle { margin: 7px 0 0; font: 600 11px/1.2 system-ui, sans-serif; letter-spacing: .04em;
                         text-transform: uppercase; opacity: .72; }
  #panel .section-toggle::before, #panel .group-toggle::before { content: ''; flex: 0 0 auto; width: 0; height: 0;
              border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid currentColor;
              transform: rotate(-90deg); }
  #panel .section-toggle[aria-expanded="true"]::before, #panel .group-toggle[aria-expanded="true"]::before { transform: none; }
  #panel .section-toggle:hover, #panel .group-toggle:hover { color: #fff; }
  #panel .section-toggle:focus-visible, #panel .group-toggle:focus-visible { outline: 2px solid #e2a04e; outline-offset: 2px; }
  #panel .section-body { padding: 4px 0 2px; }
  #panel .group-body { margin-left: 14px; }
  #panel label { display: grid; grid-template-columns: 1fr 110px 72px; gap: 6px; align-items: center; margin: 3px 0; }
  #panel label.disabled { opacity: .38; }
  #panel input[type="range"] { width: 110px; accent-color: #e2a04e; }
  #panel label.color { grid-template-columns: 1fr auto; }
  #panel input[type="color"] { width: 40px; height: 25px; padding: 1px; border: 1px solid #e5e1d833;
                               border-radius: 5px; background: #18222c; cursor: pointer; }
  #panel label.toggle { grid-template-columns: 1fr auto; }
  #panel label.toggle .choice { display: flex; align-items: center; gap: 8px; }
  #panel label.toggle input { width: 16px; height: 16px; accent-color: #e2a04e; }
  #panel label.toggle output { width: auto; min-width: 2.6em; text-align: left; }
  #panel output { text-align: right; font-variant-numeric: tabular-nums; opacity: .8; }
  #panel .io { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  #panel .io button { padding: 5px 10px; border: 1px solid #e5e1d855; border-radius: 6px;
                      background: #18222ccc; color: inherit; font: inherit; cursor: pointer; }
  #panel .io button:hover { background: #243140; }
  #panel .io button:focus-visible { outline: 2px solid #e2a04e; outline-offset: 1px; }
  #panel .share-url { flex: 1 0 100%; box-sizing: border-box; width: 100%; margin: 0; padding: 4px 6px;
                      border: 1px solid #e5e1d833; border-radius: 5px; background: #18222c; color: inherit;
                      font: 11px/1.3 ui-monospace, Consolas, monospace; }
  #panel .share-url[hidden] { display: none; }
  #panel .status { min-height: 1.2em; margin-top: 5px; opacity: .75; }
  #panel .shortcuts { margin-top: 10px; }
  #panel .shortcuts h3 { margin: 0 0 4px; font: 600 11px/1.2 system-ui, sans-serif; letter-spacing: .04em;
                         text-transform: uppercase; opacity: .62; }
  #panel .shortcuts dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; }
  #panel .shortcuts dt { color: #f0e6d4; }
  #panel .shortcuts dd { margin: 0; opacity: .8; }
  #err { display: none; position: fixed; inset: 0; z-index: 5; align-items: center; justify-content: center; padding: 2em; color: #9ab; font: 18px/1.5 system-ui, sans-serif; text-align: center; background: #021018; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="toolbar">
  <button id="sound" type="button" aria-pressed="false" title="Toggle aquarium audio (M)">Sound off</button>
  <button id="settings" type="button" aria-expanded="false" title="Show settings (F1)">Settings</button>
</div>
<div id="panel" class="hidden">
  <div class="panel-bar">
    <span>Settings</span>
    <button id="close-settings" type="button" aria-label="Close settings" title="Close settings (Esc)">×</button>
  </div>
  <div id="panel-body"></div>
</div>
<div id="err"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
