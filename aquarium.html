<script type="module">
// ---- js/wgsl/common.js ----
// Shared WGSL: the per-frame uniform block, noise, caustics, shadows, water absorption and
// fog, and the underwater lighting model. Shadow-pass shaders get only the uniform block.

const FRAME_FLOATS = 104;
const SHADOW_SIZE = 2048;

const FRAME = /* wgsl */ `
diagnostic(off, derivative_uniformity);
struct Frame {
  viewProj: mat4x4f,
  invViewProj: mat4x4f,
  lightViewProj: mat4x4f,
  camPos: vec4f,     // xyz camera, w time (s)
  lightDir: vec4f,   // xyz towards the light, w sun intensity
  deep: vec4f,       // rgb deep water, w clarity
  shallow: vec4f,    // rgb shallow water, w ambient intensity
  current: vec4f,    // xyz water current, w coral animation (0/1)
  params: vec4f,     // x caustics, y light rays, z surface height, w fish shimmer
  screen: vec4f,     // w, h, 1/h, projection y scale
  drift: vec4f,      // xyz accumulated current displacement (wrapped), w unused
  src: array<vec4f, 6>, // bubble sources: xyz, w = enabled
};
@group(0) @binding(0) var<uniform> F: Frame;
`;

const NOISE = /* wgsl */ `
fn hash11(p: f32) -> f32 { return fract(sin(p * 127.1) * 43758.5453); }
fn hash21(p: vec2f) -> f32 {
  var q = fract(p * vec2f(123.34, 456.21));
  q += dot(q, q + 45.32);
  return fract(q.x * q.y);
}
fn hash22(p: vec2f) -> vec2f {
  let n = vec2f(dot(p, vec2f(127.1, 311.7)), dot(p, vec2f(269.5, 183.3)));
  return fract(sin(n) * 43758.5453);
}
fn hash31(p: vec3f) -> f32 {
  var q = fract(p * 0.1031);
  q += dot(q, q.zyx + 31.32);
  return fract((q.x + q.y) * q.z);
}
fn vnoise2(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p);
  let u = f * f * (3.0 - 2.0 * f);
  let a = hash21(i); let b = hash21(i + vec2f(1.0, 0.0));
  let c = hash21(i + vec2f(0.0, 1.0)); let d = hash21(i + vec2f(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
fn vnoise3(p: vec3f) -> f32 {
  let i = floor(p); let f = fract(p);
  let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let n000 = hash31(i); let n100 = hash31(i + vec3f(1.0, 0.0, 0.0));
  let n010 = hash31(i + vec3f(0.0, 1.0, 0.0)); let n110 = hash31(i + vec3f(1.0, 1.0, 0.0));
  let n001 = hash31(i + vec3f(0.0, 0.0, 1.0)); let n101 = hash31(i + vec3f(1.0, 0.0, 1.0));
  let n011 = hash31(i + vec3f(0.0, 1.0, 1.0)); let n111 = hash31(i + vec3f(1.0, 1.0, 1.0));
  return mix(mix(mix(n000, n100, u.x), mix(n010, n110, u.x), u.y), mix(mix(n001, n101, u.x), mix(n011, n111, u.x), u.y), u.z);
}
// rotation used between noise octaves so lattice axes never line up
const ROT3 = mat3x3f(0.00, 0.80, 0.60, -0.80, 0.36, -0.48, -0.60, -0.48, 0.64);
fn fbm3(p: vec3f) -> f32 {
  return vnoise3(p) * 0.5 + vnoise3(p * 2.03 + 11.7) * 0.25 + vnoise3(p * 4.11 + 3.1) * 0.125 + vnoise3(p * 8.17 + 7.3) * 0.0625;
}
// Voronoi cell distances: x = nearest, y = second nearest, z = cell id hash
fn voronoi2(p: vec2f) -> vec3f {
  let ip = floor(p); let fp = fract(p);
  var d1 = 8.0; var d2 = 8.0; var id = 0.0;
  for (var j = -1; j <= 1; j++) {
    for (var i = -1; i <= 1; i++) {
      let g = vec2f(f32(i), f32(j));
      let o = hash22(ip + g);
      let r = g + o - fp;
      let d = dot(r, r);
      if (d < d1) { d2 = d1; d1 = d; id = hash21(ip + g); } else if (d < d2) { d2 = d; }
    }
  }
  return vec3f(sqrt(d1), sqrt(d2), id);
}
fn ign(p: vec2f) -> f32 { return fract(52.9829189 * fract(dot(p, vec2f(0.06711056, 0.00583715)))); }
fn srgb(c: vec3f) -> vec3f { return pow(c, vec3f(2.2)); }
`;

const CAUSTICS = /* wgsl */ `
// Animated Voronoi edge network: bright filaments where neighbouring cells meet, the way
// light focused by surface waves draws on the reef.
fn causticEdge(p: vec2f, t: f32) -> f32 {
  let ip = floor(p); let fp = fract(p);
  var d1 = 8.0; var d2 = 8.0;
  for (var j = -1; j <= 1; j++) {
    for (var i = -1; i <= 1; i++) {
      let g = vec2f(f32(i), f32(j));
      let h = hash22(ip + g);
      let o = 0.5 + 0.38 * sin(vec2f(t * (0.55 + h.x * 0.45), t * (0.5 + h.y * 0.5)) + h * 6.2831);
      let r = g + o - fp;
      let d = dot(r, r);
      if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) { d2 = d; }
    }
  }
  return sqrt(d2) - sqrt(d1);
}
fn causticsAt(P: vec3f) -> f32 {
  let depth = max(F.params.z - P.y, 0.0);
  let L = F.lightDir.xyz;
  let s = P.xz + L.xz / max(L.y, 0.25) * depth;
  let t = F.camPos.w;
  let warp = vec2f(vnoise2(s * 0.31 + vec2f(t * 0.045, 0.0)), vnoise2(s * 0.31 + vec2f(17.0, -t * 0.04))) - 0.5;
  let uv = s * 1.15 + warp * 1.6;
  let blur = mix(0.12, 0.3, saturate(depth / 8.0));
  let e1 = causticEdge(uv, t * 0.8);
  let e2 = causticEdge(uv * 1.71 + vec2f(3.1, 7.7), t * 1.05);
  let c1 = 1.0 - smoothstep(0.0, blur, e1);
  let c2 = 1.0 - smoothstep(0.0, blur * 1.4, e2);
  return c1 * 0.7 + c2 * 0.45;
}
`;

const LIGHTING = /* wgsl */ `
@group(0) @binding(1) var shadowMap: texture_depth_2d;
@group(0) @binding(2) var shadowSamp: sampler_comparison;

const POISSON = array<vec2f, 12>(
  vec2f(-0.326, -0.406), vec2f(-0.840, -0.074), vec2f(-0.696, 0.457), vec2f(-0.203, 0.621),
  vec2f(0.962, -0.195), vec2f(0.473, -0.480), vec2f(0.519, 0.767), vec2f(0.185, -0.893),
  vec2f(0.507, 0.064), vec2f(0.896, 0.412), vec2f(-0.322, -0.933), vec2f(-0.792, -0.598));

fn shadowAt(P: vec3f, N: vec3f, px: vec2f) -> f32 {
  let q = F.lightViewProj * vec4f(P + N * 0.05, 1.0);
  let uv = q.xy * vec2f(0.5, -0.5) + 0.5;
  let z = q.z - 0.0016;
  let inside = all(uv > vec2f(0.0)) && all(uv < vec2f(1.0)) && q.z < 1.0;
  let a = ign(px) * 6.2831;
  let rot = mat2x2f(cos(a), sin(a), -sin(a), cos(a));
  let r = 2.2 / ${SHADOW_SIZE}.0;
  var s = 0.0;
  for (var i = 0; i < 12; i++) {
    s += textureSampleCompareLevel(shadowMap, shadowSamp, uv + rot * POISSON[i] * r, z);
  }
  return select(1.0, s / 12.0, inside);
}

fn sunColor() -> vec3f { return vec3f(1.0, 0.97, 0.9) * F.lightDir.w; }

// Light lost on the way down from the surface (red goes first).
fn depthAttenuation(y: f32) -> vec3f {
  let d = max(F.params.z - y, 0.0);
  return exp(-vec3f(0.11, 0.035, 0.022) * d / max(F.deep.w, 0.2));
}

// Background water seen along a view direction: brighter towards the surface.
fn waterColor(dir: vec3f) -> vec3f {
  let h = saturate(dir.y * 1.9 + 0.48);
  var c = mix(F.deep.rgb, F.shallow.rgb, h * h * (3.0 - 2.0 * h));
  let glow = pow(max(dot(dir, F.lightDir.xyz), 0.0), 5.0);
  c += F.shallow.rgb * glow * 0.25;
  return c;
}

// Length of the view ray that runs through water (the camera is outside the glass at z > 0).
fn waterDistance(P: vec3f) -> f32 {
  let v = P - F.camPos.xyz;
  let frac = saturate(-P.z / max(F.camPos.z - P.z, 1e-3));
  return length(v) * frac;
}

fn applyWater(col: vec3f, P: vec3f) -> vec3f {
  let d = waterDistance(P);
  let dir = normalize(P - F.camPos.xyz);
  let k = 1.0 / max(F.deep.w, 0.2);
  let absorb = exp(-vec3f(0.075, 0.03, 0.022) * d * k);
  let fog = 1.0 - exp(-d * 0.074 * k);
  return mix(col * absorb, waterColor(dir), fog);
}

fn hemiAmbient(N: vec3f) -> vec3f {
  let up = F.shallow.rgb * 1.35 + vec3f(0.05, 0.07, 0.08);
  let down = vec3f(0.30, 0.34, 0.33) * 0.55 + F.deep.rgb * 0.4;
  return mix(down, up, N.y * 0.5 + 0.5) * F.shallow.w;
}

fn ggx(N: vec3f, V: vec3f, L: vec3f, rough: f32, f0: f32) -> f32 {
  let H = normalize(V + L);
  let nh = max(dot(N, H), 0.0); let nl = max(dot(N, L), 0.0); let nv = max(dot(N, V), 1e-3);
  let a = rough * rough; let a2 = a * a;
  let dd = nh * nh * (a2 - 1.0) + 1.0;
  let D = a2 / (3.14159 * dd * dd);
  let k = a * 0.5;
  let G = nl / (nl * (1.0 - k) + k) * nv / (nv * (1.0 - k) + k);
  let Fr = f0 + (1.0 - f0) * pow(1.0 - max(dot(H, V), 0.0), 5.0);
  return D * G * Fr / max(4.0 * nv, 1e-3);
}

struct Surface {
  albedo: vec3f,
  rough: f32,
  f0: f32,
  ao: f32,
  translucency: f32,
  causticK: f32,
};

fn shade(P: vec3f, N: vec3f, s: Surface, px: vec2f) -> vec3f {
  let V = normalize(F.camPos.xyz - P);
  let L = F.lightDir.xyz;
  let sh = shadowAt(P, N, px);
  let caus = causticsAt(P) * F.params.x * s.causticK;
  let direct = sunColor() * depthAttenuation(P.y) * sh * (0.6 + caus * 0.8);
  let nl = dot(N, L);
  let wrap = saturate((nl + 0.25) / 1.25);
  var c = s.albedo * wrap * direct;
  c += s.albedo * saturate(-nl) * s.translucency * direct;
  c += s.albedo * hemiAmbient(N) * s.ao;
  c += vec3f(ggx(N, V, L, s.rough, s.f0)) * direct * saturate(nl * 4.0);
  let fr = s.f0 + (1.0 - s.f0) * pow(1.0 - max(dot(N, V), 0.0), 5.0);
  c += waterColor(reflect(-V, N)) * fr * 0.35 * s.ao * (1.0 - s.rough * 0.6);
  return c;
}
`;

function common({ shadow = false } = {}) {
  return FRAME + NOISE + (shadow ? '' : CAUSTICS + LIGHTING);
}

// ---- js/wgsl/fish.js ----
// Fish: procedural swimming deformation and per-species colour patterns.
//
// Instance layout (5 x vec4, written by Aquarium.writeInstances):
//   i0 position xyz, body length      i1 heading xyz, tail phase
//   i2 up xyz, tail amplitude         i3 bend, pectoral phase, pectoral amplitude, turn asymmetry
//   i4 colour variant, light reaching the fish, jaw gape, median-fin phase

const SPECIES_BLOCK = /* wgsl */ `
struct Species {
  a: vec4f,  // id, swim style, body wave number, median fin undulation
  b: vec4f,  // pivot, peduncle t, textured (0/1), pectoral fin length
  c: vec4f,  // eye t, eye y, scale frequency, unused
};
@group(1) @binding(0) var<uniform> SP: Species;

struct VIn {
  @location(0) pos: vec3f,
  @location(1) nrm: vec3f,
  @location(2) buv: vec2f,
  @location(3) aux: vec4f,
  @location(4) tex: vec2f,
  @location(5) i0: vec4f,
  @location(6) i1: vec4f,
  @location(7) i2: vec4f,
  @location(8) i3: vec4f,
  @location(9) i4: vec4f,
};

struct Deformed { p: vec3f, n: vec3f };

fn deform(v: VIn) -> Deformed {
  var p = v.pos;
  var n = v.nrm;
  let part = i32(v.aux.x + 0.5);
  let style = i32(SP.a.y + 0.5);
  let t = v.buv.x;
  let phase = v.i1.w;
  let amp = v.i2.w;
  let bend = v.i3.x;

  // moray lower jaw swings open around its hinge
  if (part == 0 && v.aux.w > 0.0) {
    let ang = -v.i4.z * v.aux.w;
    let h = v.tex;
    let d = p.xy - h;
    let c = cos(ang); let s = sin(ang);
    p = vec3f(h + vec2f(d.x * c - d.y * s, d.x * s + d.y * c), p.z);
  }
  // paired fins row and flap; on a turn the outer fin sweeps harder
  if (part == 4 || part == 5) {
    let u = v.aux.z; let s = v.aux.w; let side = v.aux.y;
    let k = select(1.0, 0.45, part == 5);
    let dist = u * SP.b.w * k;
    let flap = sin(v.i3.y - u * 1.4 + s * 1.2 + select(0.0, 1.3, part == 5)) * v.i3.z;
    let asym = v.i3.w * side;
    p.z += side * dist * (flap * 0.85 + 0.25 + asym * 0.35);
    p.x += dist * flap * 0.3;
    n = normalize(n + vec3f(0.0, 0.0, side * flap * 0.3));
  }
  // dorsal and anal fins: travelling undulation (triggerfish) and a gentle flutter
  if (part == 2 || part == 3) {
    let u = v.aux.z;
    let und = SP.a.w * sin(v.i4.w - t * 22.0) * u;
    let flutter = 0.004 * sin(phase * 0.5 + t * 11.0) * u;
    p.z += und + flutter;
  }
  // caudal fin lags the body wave
  if (part == 1) {
    let u = v.aux.z;
    p.z += sin(phase - 1.1 - v.aux.w * 0.5) * amp * 0.45 * u * u;
  }

  // body wave: amplitude grows from a slight head yaw to the tail
  let tt = clamp(t, 0.0, 1.3);
  var env: f32; var denv: f32;
  if (style == 4) {
    let x = saturate(tt / 0.7);
    env = 0.25 + 0.75 * x * x * (3.0 - 2.0 * x);
    denv = 0.75 * 6.0 * x * (1.0 - x) / 0.7;
  } else {
    env = 0.1 - 0.3 * tt + 1.15 * tt * tt;
    denv = -0.3 + 2.3 * tt;
  }
  let k = SP.a.z * 6.2831853;
  let w = phase - tt * k;
  let dz = amp * env * sin(w);
  let dzdt = amp * (denv * sin(w) - env * k * cos(w));
  // turning curves the whole body into a C
  var db: f32; var dbdx: f32;
  let xb = p.x;
  if (style == 4) {
    let q = max(0.0, xb + 0.12);
    db = bend * q * q * 9.0; dbdx = bend * q * 18.0;
  } else {
    db = bend * xb * xb * 1.4; dbdx = bend * xb * 2.8;
  }
  p.z += dz + db;
  let slope = -dzdt + dbdx; // d(offset)/dx, x = pivot - t
  n = normalize(vec3f(n.x - slope * n.z, n.y, n.z));
  return Deformed(p, n);
}

fn basisRight(fwd: vec3f, up: vec3f) -> vec3f { return normalize(cross(fwd, up)); }
`;

const FISH = common() + SPECIES_BLOCK + /* wgsl */ `
@group(1) @binding(1) var albedoTex: texture_2d<f32>;
@group(1) @binding(2) var albedoSamp: sampler;

struct VOut {
  @builtin(position) clip: vec4f,
  @location(0) world: vec3f,
  @location(1) nrm: vec3f,
  @location(2) buv: vec2f,
  @location(3) aux: vec4f,
  @location(4) tex: vec2f,
  @location(5) fwd: vec3f,
  @location(6) up: vec3f,
  @location(7) @interpolate(flat) misc: vec4f,
  @location(8) lp: vec3f,
};

@vertex fn vs(v: VIn) -> VOut {
  let d = deform(v);
  let fwd = normalize(v.i1.xyz);
  let up = normalize(v.i2.xyz);
  let right = basisRight(fwd, up);
  let L = v.i0.w;
  let world = v.i0.xyz + (fwd * d.p.x + up * d.p.y + right * d.p.z) * L;
  var o: VOut;
  o.clip = F.viewProj * vec4f(world, 1.0);
  o.world = world;
  o.nrm = normalize(fwd * d.n.x + up * d.n.y + right * d.n.z);
  o.buv = v.buv;
  o.aux = v.aux;
  o.tex = v.tex;
  o.fwd = fwd;
  o.up = up;
  o.misc = vec4f(v.i4.x, v.i4.y, v.i4.z, 0.0);
  o.lp = v.pos;
  return o;
}

struct Mat { col: vec3f, alpha: f32, rough: f32, irid: f32 };

fn band(x: f32, c: f32, hw: f32, aa: f32) -> f32 { return 1.0 - smoothstep(hw - aa, hw + aa, abs(x - c)); }
fn inEllipse(p: vec2f, c: vec2f, r: vec2f, aa: f32) -> f32 { return 1.0 - smoothstep(1.0 - aa, 1.0 + aa, length((p - c) / r)); }
// thin periodic lines with their own antialiasing: fade to the average when too fine to resolve
fn stripes(q: f32, duty: f32) -> f32 {
  let fw = fwidth(q);
  let d = abs(fract(q) - 0.5) * 2.0;
  let s = 1.0 - smoothstep(duty - fw, duty + fw, d);
  return mix(s, duty, saturate(fw * 1.5 - 0.3));
}
fn segDist(p: vec2f, a: vec2f, b: vec2f) -> f32 {
  let pa = p - a; let ba = b - a;
  let h = saturate(dot(pa, ba) / dot(ba, ba));
  return length(pa - ba * h);
}
// fin rays: darker lines along the rays, translucent membrane between them
fn rays(s: f32, n: f32) -> f32 { return stripes(s * n, 0.18); }

const BLACK = vec3f(0.012, 0.012, 0.014);
const WHITE = vec3f(0.86, 0.86, 0.84);

fn clownfish(part: i32, t: f32, y: f32, u: f32, s: f32, aa: f32) -> Mat {
  let orange = srgb(vec3f(0.98, 0.43, 0.05));
  let y1 = clamp(y / 0.16, -1.0, 1.0);
  let c1 = 0.19 + 0.03 * (1.0 - y1 * y1);
  let c2 = 0.5 - 0.06 * (1.0 - y1 * y1);
  let wm = max(max(band(t, c1, 0.032, aa), band(t, c2, 0.042, aa)), band(t, 0.778, 0.022, aa));
  let em = max(max(band(t, c1, 0.041, aa), band(t, c2, 0.051, aa)), band(t, 0.778, 0.031, aa));
  var col = mix(orange, BLACK, em);
  col = mix(col, WHITE, wm);
  var alpha = 1.0;
  if (part >= 1 && part <= 5) {
    let edge = select(0.78, 0.86, part == 4);
    col = mix(col, BLACK, smoothstep(edge - 0.04, edge, u));
    col = mix(col, WHITE * 0.9, band(u, edge - 0.06, 0.02, 0.02) * 0.5);
    col = mix(col, orange * 0.9, rays(s, 12.0) * 0.25 * (1.0 - u));
    alpha = 0.93 - u * 0.1;
  }
  return Mat(col, alpha, 0.34, 0.15);
}

fn blueTang(part: i32, t: f32, y: f32, u: f32, s: f32, aa: f32) -> Mat {
  let blue = srgb(vec3f(0.07, 0.3, 0.9));
  let yellow = srgb(vec3f(1.0, 0.82, 0.08));
  var col = blue;
  var alpha = 1.0;
  if (part == 0) {
    let k = clamp((t - 0.1) / 0.66, 0.0, 1.0);
    let ya = 0.07 + 0.065 * sin(k * 2.7);
    let wa = 0.034 - 0.012 * k;
    var blk = band(y, ya, wa, aa) * smoothstep(0.1, 0.13, t);
    let q = length((vec2f(t, y) - vec2f(0.53, 0.035)) / vec2f(0.18, 0.08));
    blk = max(blk, band(q, 1.0, 0.24, aa * 10.0) * smoothstep(0.38, 0.42, t));
    blk = max(blk, smoothstep(0.73, 0.77, t) * (1.0 - smoothstep(0.075, 0.09, abs(y - 0.0))));
    col = mix(blue, BLACK, blk);
    // yellow scalpel at the tail base
    col = mix(col, yellow, inEllipse(vec2f(t, y), vec2f(0.785, 0.0), vec2f(0.018, 0.012), 0.2));
  } else if (part == 1) {
    let v = abs(s * 2.0 - 1.0);
    let core = 1.0 - smoothstep(0.62 - u * 0.35, 0.7 - u * 0.35, v);
    col = mix(BLACK, yellow, core * (1.0 - smoothstep(0.85, 0.95, u)));
    alpha = 0.95;
  } else if (part == 4) {
    col = mix(blue * 0.8, yellow, smoothstep(0.45, 0.65, u));
    alpha = 0.85 - u * 0.2;
  } else {
    col = mix(blue, BLACK, smoothstep(0.5, 0.65, u));
    col = mix(col, srgb(vec3f(0.3, 0.6, 1.0)), band(u, 0.42, 0.04, 0.03) * 0.6);
    alpha = 0.95;
  }
  return Mat(col, alpha, 0.3, 0.35);
}

fn yellowTang(part: i32, t: f32, y: f32, u: f32, s: f32, aa: f32, lp: vec3f) -> Mat {
  let yellow = srgb(vec3f(1.0, 0.84, 0.07));
  var col = yellow * (0.92 + 0.12 * vnoise2(vec2f(t, y) * 40.0));
  var alpha = 1.0;
  if (part == 0) {
    col = mix(col, WHITE, inEllipse(vec2f(t, y), vec2f(0.795, -0.005), vec2f(0.014, 0.007), 0.25));
    col *= 1.0 - 0.06 * stripes(y * 55.0, 0.2);
  } else {
    col = yellow * mix(0.95, 0.85, u);
    col = mix(col, yellow * 0.75, rays(s, 22.0) * 0.4);
    alpha = 0.9 - u * 0.15;
  }
  return Mat(col, alpha, 0.36, 0.1);
}

fn emperor(part: i32, t: f32, y: f32, u: f32, s: f32, aa: f32) -> Mat {
  let navy = srgb(vec3f(0.03, 0.08, 0.36));
  let yel = srgb(vec3f(1.0, 0.8, 0.14));
  let pale = srgb(vec3f(0.62, 0.76, 0.86));
  let bright = srgb(vec3f(0.3, 0.62, 1.0));
  let st = stripes((t - 0.62 * y) / 0.027, 0.42);
  var col = mix(navy, yel, st);
  var alpha = 1.0;
  if (part == 0 || part == 2) {
    // pale face with a dark mask through the eye, then a dark bar behind the gill
    let face = 1.0 - smoothstep(0.2, 0.22, t);
    col = mix(col, pale * (0.85 + 0.15 * stripes(y * 40.0, 0.3)), face);
    let mask = band(t, 0.118, 0.032, aa) * smoothstep(-0.14, -0.1, y);
    col = mix(col, bright, band(t, 0.118, 0.04, aa) * smoothstep(-0.14, -0.1, y) * face);
    col = mix(col, navy * 0.4, mask);
    let bar = band(t, 0.262, 0.032, aa) * (1.0 - smoothstep(0.17, 0.2, abs(y)));
    col = mix(col, bright, band(t, 0.262, 0.04, aa) * (1.0 - smoothstep(0.17, 0.2, abs(y))));
    col = mix(col, navy * 0.35, bar);
    if (part == 2) { col = mix(col, WHITE, smoothstep(0.85, 0.95, u)); alpha = 0.97; }
  } else if (part == 1) {
    col = srgb(vec3f(1.0, 0.68, 0.1));
    alpha = 0.95;
  } else if (part == 3) {
    col = mix(navy, bright, stripes(u * 4.5 + s * 1.5, 0.18));
    alpha = 0.97;
  } else {
    col = mix(navy * 0.6, yel, select(0.0, 0.6, part == 5));
    alpha = 0.8;
  }
  return Mat(col, alpha, 0.32, 0.25);
}

fn butterfly(part: i32, t: f32, y: f32, u: f32, s: f32, aa: f32) -> Mat {
  let white = vec3f(0.88, 0.88, 0.84);
  let yel = srgb(vec3f(1.0, 0.78, 0.1));
  let line = srgb(vec3f(0.22, 0.18, 0.15));
  var col = white;
  var alpha = 1.0;
  let upper = y > 0.01 + 0.25 * (t - 0.4);
  let q = select(t + y, t - y, upper);
  col = mix(col, line, stripes(q / 0.036, 0.22) * 0.85);
  let rear = smoothstep(0.5, 0.64, t + 0.35 * y);
  col = mix(col, mix(yel, yel * 0.85, stripes(q / 0.036, 0.22) * 0.4), rear);
  if (part == 0) {
    let bar = band(t, 0.142, 0.017, aa) * smoothstep(-0.13, -0.1, y);
    col = mix(col, WHITE, band(t, 0.142, 0.026, aa) * smoothstep(-0.13, -0.1, y));
    col = mix(col, BLACK, bar);
    col = mix(col, white * 0.95, 1.0 - smoothstep(0.05, 0.07, t));
  } else if (part == 2) {
    col = mix(yel, yel * 0.9, u);
    let spot = inEllipse(vec2f(s, u), vec2f(0.8, 0.45), vec2f(0.09, 0.28), 0.15);
    col = mix(col, WHITE, inEllipse(vec2f(s, u), vec2f(0.8, 0.45), vec2f(0.12, 0.36), 0.15));
    col = mix(col, BLACK, spot);
    alpha = 0.97;
  } else if (part == 1) {
    col = mix(yel, BLACK, band(u, 0.72, 0.06, 0.03));
    alpha = select(0.95, 0.35, u > 0.8);
  } else if (part == 3) {
    col = mix(yel, BLACK, band(u, 0.8, 0.04, 0.03));
    alpha = 0.95;
  } else {
    col = white;
    alpha = 0.35;
  }
  return Mat(col, alpha, 0.34, 0.12);
}

fn gramma(part: i32, t: f32, y: f32, u: f32, s: f32, aa: f32) -> Mat {
  let purple = srgb(vec3f(0.46, 0.07, 0.64));
  let yel = srgb(vec3f(1.0, 0.74, 0.05));
  let m = smoothstep(0.43, 0.52, t + y * 0.15);
  var col = mix(purple, yel, m);
  var alpha = 1.0;
  if (part == 0) {
    let l = band(y, 0.045 - (t - 0.05) * 0.45, 0.004, aa) * (1.0 - smoothstep(0.18, 0.2, t));
    col = mix(col, yel, l);
  } else if (part == 2) {
    col = mix(col, BLACK, inEllipse(vec2f(s, u), vec2f(0.07, 0.6), vec2f(0.08, 0.32), 0.2));
    alpha = 0.92;
  } else if (part == 4) { col = mix(purple, yel, 0.3); alpha = 0.45; }
  else if (part == 5) { col = purple; alpha = 0.95; }
  else { alpha = 0.92; }
  return Mat(col, alpha, 0.36, 0.2);
}

fn idol(part: i32, t: f32, y: f32, u: f32, s: f32, aa: f32) -> Mat {
  let white = vec3f(0.9, 0.89, 0.82);
  let yel = srgb(vec3f(1.0, 0.84, 0.18));
  let orange = srgb(vec3f(1.0, 0.56, 0.1));
  var col = white;
  var alpha = 1.0;
  let b1 = band(t, 0.27 - 0.13 * y, 0.068, aa);
  let b2 = band(t, 0.695 - 0.06 * y, 0.042, aa);
  if (part == 0 || ((part == 2 || part == 3) && u < 0.45)) {
    let wash = smoothstep(0.36, 0.42, t) * (1.0 - smoothstep(0.6, 0.65, t)) * smoothstep(-0.12, 0.05, y);
    col = mix(col, yel, wash);
    col = mix(col, BLACK, max(b1, b2));
    col = mix(col, WHITE, band(t, 0.72 - 0.06 * y, 0.006, aa) * b2);
    if (part == 0) {
      col = mix(col, orange, smoothstep(0.06, 0.08, t) * (1.0 - smoothstep(0.12, 0.14, t)) * smoothstep(0.0, 0.02, y));
      col = mix(col, BLACK, 1.0 - smoothstep(0.025, 0.035, t));
    }
  } else if (part == 1) {
    col = mix(BLACK, WHITE, smoothstep(0.8, 0.88, u));
    alpha = 0.95;
  } else if (part == 5) {
    col = BLACK;
  } else if (part == 4) {
    col = white; alpha = 0.4;
  } else {
    col = mix(white, yel, 0.2 * (1.0 - u));
    alpha = 0.92;
  }
  return Mat(col, alpha, 0.34, 0.1);
}

fn lionfish(part: i32, t: f32, y: f32, u: f32, s: f32, seg: f32, aa: f32) -> Mat {
  let cream = vec3f(0.9, 0.83, 0.72);
  let maroon = srgb(vec3f(0.48, 0.11, 0.07));
  var col = cream;
  var alpha = 1.0;
  if (part == 0) {
    let q = t * 25.0 + sin(y * 16.0 + t * 5.0) * 0.45 + y * select(5.0, -7.0, t < 0.16);
    let sn = sin(q * 3.14159);
    col = mix(cream, maroon, smoothstep(-0.15, 0.25, sn));
    col = mix(col, maroon * 1.2, band(sn, -0.8, 0.07, 0.05) * 0.8);
  } else if (part == 4 || part == 5 || (part == 2 && seg < 0.5)) {
    let n = select(16.0, 12.0, part == 2);
    let r = stripes(s * n, 0.22);
    let banded = mix(cream, maroon, smoothstep(-0.2, 0.2, sin(u * 26.0)));
    let spots = 1.0 - smoothstep(0.18, 0.26, voronoi2(vec2f(u * 9.0, s * n)).x);
    let membrane = mix(vec3f(0.92, 0.86, 0.82), maroon, spots * 0.7);
    col = mix(membrane, banded, r);
    var ma = select(0.42, 0.5, part == 5);
    if (part == 2) { ma *= 1.0 - smoothstep(0.22, 0.42, u); }
    alpha = mix(ma, 1.0, r);
  } else {
    let spots = 1.0 - smoothstep(0.2, 0.28, voronoi2(vec2f(u * 8.0, s * 14.0)).x);
    col = mix(vec3f(0.9, 0.86, 0.82), maroon, spots * 0.8);
    alpha = mix(0.38, 0.95, max(spots, rays(s, 14.0)));
  }
  return Mat(col, alpha, 0.4, 0.05);
}

fn damsel(part: i32, t: f32, y: f32, u: f32, s: f32, aa: f32, variant: f32) -> Mat {
  let blue = srgb(vec3f(0.03, 0.3, 0.98)) * (0.85 + variant * 0.25);
  let tailY = srgb(vec3f(0.95, 0.8, 0.25));
  let yt = select(0.0, 1.0, variant > 0.62);
  var col = blue;
  var alpha = 1.0;
  if (part == 0) {
    col = mix(col, blue * 0.7, smoothstep(0.02, 0.12, y));
    col = mix(col, BLACK, band(y, 0.042 + (t - 0.1) * 0.15, 0.0045, aa) * (1.0 - smoothstep(0.17, 0.19, t)));
    col = mix(col, tailY, yt * smoothstep(0.62, 0.78, t) * 0.8);
  } else if (part == 1) {
    col = mix(blue, tailY, yt);
    alpha = mix(0.85, 0.6, u);
  } else if (part == 4) {
    col = blue * 0.7; alpha = 0.35;
  } else {
    col = mix(blue, BLACK, smoothstep(0.8, 0.95, u) * 0.7);
    col = mix(col, tailY, yt * select(0.0, 0.7, part == 3));
    alpha = 0.9;
  }
  return Mat(col, alpha, 0.26, 0.55);
}

fn anthias(part: i32, t: f32, y: f32, u: f32, s: f32, aa: f32, variant: f32) -> Mat {
  let male = variant > 0.68;
  let orange = srgb(vec3f(1.0, 0.5, 0.17));
  let pink = srgb(vec3f(1.0, 0.45, 0.48));
  let magenta = srgb(vec3f(0.85, 0.22, 0.5));
  let lav = srgb(vec3f(0.72, 0.5, 1.0));
  var col = select(mix(orange, pink, smoothstep(0.05, -0.08, y) * 0.5), mix(magenta, orange, smoothstep(0.02, 0.12, y) * 0.5), male);
  var alpha = 1.0;
  if (part == 0) {
    let d = segDist(vec2f(t, y), vec2f(0.07, 0.012), vec2f(0.23, -0.045));
    col = mix(col, lav, (1.0 - smoothstep(0.006 - aa, 0.006 + aa, d)) * (1.0 - smoothstep(0.24, 0.26, t)));
  } else if (part == 1) {
    let v = abs(s * 2.0 - 1.0);
    col = mix(col, srgb(vec3f(0.95, 0.2, 0.25)), smoothstep(0.7, 0.9, v) * 0.8);
    alpha = mix(0.92, 0.7, u);
  } else if (part == 4) {
    col = select(col, srgb(vec3f(0.85, 0.1, 0.25)), male && u < 0.5);
    alpha = 0.6;
  } else {
    col = mix(col, srgb(vec3f(0.9, 0.15, 0.2)), smoothstep(0.75, 0.95, u));
    alpha = 0.9;
  }
  return Mat(col, alpha, 0.3, 0.3);
}

fn trigger(part: i32, t: f32, y: f32, u: f32, s: f32, aa: f32) -> Mat {
  let tan = srgb(vec3f(0.7, 0.62, 0.45));
  let white = vec3f(0.88, 0.87, 0.83);
  let blue = srgb(vec3f(0.14, 0.45, 0.9));
  let orange = srgb(vec3f(1.0, 0.55, 0.12));
  var alpha = 1.0;
  var col: vec3f;
  if (part == 0) {
    let line = -0.02 + 0.04 * sin(t * 4.0);
    col = mix(white, tan, smoothstep(line - 0.015, line + 0.015, y));
    // bands from the eye down and back towards the pectoral
    let q = (t - 0.27) + 0.55 * (0.1 - y);
    let face = smoothstep(0.18, 0.2, t) * (1.0 - smoothstep(0.12, 0.14, y)) * smoothstep(-0.1, -0.06, y);
    var fb = 0.0;
    fb = max(fb, band(q, 0.006, 0.006, aa));
    fb = max(fb, band(q, 0.041, 0.006, aa));
    fb = max(fb, band(q, 0.076, 0.006, aa));
    let fk = band(q, 0.0235, 0.011, aa) + band(q, 0.0585, 0.011, aa);
    col = mix(col, blue, fb * face);
    col = mix(col, BLACK, saturate(fk) * face);
    // lips and the blue line along the cheek
    col = mix(col, orange, 1.0 - smoothstep(0.035, 0.05, t));
    col = mix(col, blue, band(y, -0.012 + (t - 0.04) * 0.12, 0.005, aa) * smoothstep(0.04, 0.06, t) * (1.0 - smoothstep(0.3, 0.33, t)));
    // black side patch with white bars, then black chevrons by the tail
    let sidePatch = inEllipse(vec2f(t, y), vec2f(0.56, -0.07), vec2f(0.15, 0.085), 0.08);
    col = mix(col, mix(BLACK, white, stripes((t + y * 0.7) / 0.05, 0.3)), sidePatch);
    let chev = stripes((t - y * 1.3) / 0.034, 0.5) * smoothstep(0.69, 0.71, t) * (1.0 - smoothstep(0.08, 0.1, abs(y)));
    col = mix(col, BLACK, chev);
    col = mix(col, orange, band(y, 0.0, 0.006, aa) * smoothstep(0.69, 0.71, t));
  } else {
    col = mix(vec3f(0.85, 0.8, 0.7), tan * 0.6, smoothstep(0.8, 0.95, u));
    col = mix(col, tan * 0.7, rays(s, 18.0) * 0.4);
    alpha = select(0.55, 0.8, part == 1);
    if (part == 1) { col = mix(col, BLACK, smoothstep(0.82, 0.9, u)); }
  }
  return Mat(col, alpha, 0.38, 0.05);
}

fn moray(part: i32, t: f32, y: f32, lp: vec3f, aa: f32) -> Mat {
  let pale = srgb(vec3f(0.88, 0.8, 0.5));
  let brown = srgb(vec3f(0.16, 0.1, 0.04));
  let ang = atan2(lp.y, lp.z);
  let freq = select(85.0, 135.0, t < 0.1);
  let p = vec2f(t * freq, ang * 0.042 * freq);
  let c = voronoi2(p);
  let edge = c.y - c.x;
  let spot = smoothstep(0.06, 0.14, edge);
  var col = mix(pale, brown * (0.8 + 0.4 * c.z), spot);
  col = mix(col, pale * 1.05, smoothstep(-0.01, -0.035, lp.y) * 0.35);
  return Mat(col, 1.0, 0.42, 0.0);
}

fn eyeColor(id: i32) -> vec3f {
  switch (id) {
    case 0: { return srgb(vec3f(0.95, 0.5, 0.1)); }
    case 1, 2, 3: { return srgb(vec3f(0.15, 0.17, 0.2)); }
    case 7: { return srgb(vec3f(0.55, 0.12, 0.06)); }
    case 10: { return srgb(vec3f(0.95, 0.45, 0.1)); }
    case 11: { return srgb(vec3f(0.85, 0.72, 0.3)); }
    default: { return srgb(vec3f(0.7, 0.55, 0.2)); }
  }
}

struct FOut { @location(0) color: vec4f };

@fragment fn fs(in: VOut, @builtin(front_facing) front: bool) -> FOut {
  let id = i32(SP.a.x + 0.5);
  let part = i32(in.aux.x + 0.5);
  let t = in.buv.x;
  let y = in.buv.y;
  let aa = max(fwidth(t), fwidth(y)) * 1.2 + 0.0008;
  var u = in.aux.z;
  var s = in.aux.w;
  var seg = 0.0;
  if (part == 2 || part == 3) { seg = floor(s * 0.5); s = s - seg * 2.0; }
  let variant = in.misc.x;

  var m: Mat;
  if (part == 6) {
    let r = in.aux.z;
    let iris = eyeColor(id) * (0.75 + 0.35 * vnoise2(vec2f(in.aux.w * 6.0, r * 8.0)));
    var c = mix(vec3f(0.004), iris, smoothstep(0.38, 0.46, r));
    c = mix(c, vec3f(0.02), smoothstep(0.8, 0.95, r));
    m = Mat(c, 1.0, 0.06, 0.0);
  } else if (SP.b.z > 0.5) {
    let tc = textureSample(albedoTex, albedoSamp, in.tex);
    m = Mat(tc.rgb, tc.a, 0.35, 0.1);
  } else {
    switch (id) {
      case 0: { m = clownfish(part, t, y, u, s, aa); }
      case 1: { m = blueTang(part, t, y, u, s, aa); }
      case 2: { m = yellowTang(part, t, y, u, s, aa, in.lp); }
      case 3: { m = emperor(part, t, y, u, s, aa); }
      case 4: { m = butterfly(part, t, y, u, s, aa); }
      case 5: { m = gramma(part, t, y, u, s, aa); }
      case 6: { m = idol(part, t, y, u, s, aa); }
      case 7: { m = lionfish(part, t, y, u, s, seg, aa); }
      case 8: { m = damsel(part, t, y, u, s, aa, variant); }
      case 9: { m = anthias(part, t, y, u, s, aa, variant); }
      case 10: { m = trigger(part, t, y, u, s, aa); }
      default: { m = moray(part, t, y, in.lp, aa); }
    }
  }
  if (m.alpha < 0.02) { discard; }

  var N = normalize(in.nrm);
  if (!front) { N = -N; }
  var col = m.col;
  let isBody = part == 0;
  if (isBody) {
    // countershading: a lighter belly and slightly darker back
    col *= mix(1.1, 0.9, saturate(in.aux.z * 0.5 + 0.5));
    // gill cover edge and mouth line
    if (id != 11) {
      col *= 1.0 - 0.22 * (1.0 - smoothstep(0.0, 0.006, abs(t - (SP.c.x + 0.085 + 0.25 * y * y)))) * step(abs(y - SP.c.y + 0.02), 0.16);
    }
    // overlapping scales: edges and a small tilt of the normal per scale
    let f = SP.c.z;
    if (f > 0.0) {
      let q = vec2f(t * f, y * f * 1.2);
      let row = floor(q.y);
      let cp = vec2f(fract(q.x + 0.5 * fract(row * 0.5) * 2.0), fract(q.y)) - 0.5;
      let fade = 1.0 - saturate(fwidth(q.x) * 2.5 - 0.5);
      let d = length(cp * vec2f(1.0, 1.25));
      col *= 1.0 - 0.07 * smoothstep(0.32, 0.5, d) * fade;
      N = normalize(N + (in.fwd * -cp.x + in.up * cp.y) * 0.22 * fade * (1.0 - abs(dot(N, in.up))));
    }
    if (!front) { col = srgb(vec3f(0.45, 0.16, 0.16)); }
  }
  let isFin = part >= 1 && part <= 5;
  var sfc: Surface;
  sfc.albedo = col;
  sfc.rough = m.rough;
  sfc.f0 = select(0.04, 0.03, isFin);
  sfc.ao = in.misc.y;
  sfc.translucency = select(0.15, 0.75, isFin);
  sfc.causticK = 0.75 * F.params.w;
  var c = shade(in.world, N, sfc, in.clip.xy) * mix(0.55, 1.0, in.misc.y);
  // iridescent sheen at grazing angles
  let V = normalize(F.camPos.xyz - in.world);
  let ndv = saturate(dot(N, V));
  let irid = 0.5 + 0.5 * cos(6.2831 * (vec3f(0.0, 0.33, 0.67) + ndv * 1.3 + t * 0.5));
  c += irid * m.irid * pow(1.0 - ndv, 2.0) * 0.2 * sunColor() * depthAttenuation(in.world.y) * in.misc.y;
  if (part == 6) {
    // corneal highlight
    c += vec3f(ggx(N, V, F.lightDir.xyz, 0.08, 0.05)) * sunColor() * 0.8;
  }
  c = applyWater(c, in.world);
  var o: FOut;
  o.color = vec4f(c, saturate(m.alpha));
  return o;
}
`;

const FISH_SHADOW = common({ shadow: true }) + SPECIES_BLOCK + /* wgsl */ `
@vertex fn vs(v: VIn) -> @builtin(position) vec4f {
  let part = i32(v.aux.x + 0.5);
  if (part != 0) { return vec4f(2.0, 2.0, 2.0, 1.0); }
  let d = deform(v);
  let fwd = normalize(v.i1.xyz);
  let up = normalize(v.i2.xyz);
  let right = basisRight(fwd, up);
  let world = v.i0.xyz + (fwd * d.p.x + up * d.p.y + right * d.p.z) * v.i0.w;
  return F.lightViewProj * vec4f(world, 1.0);
}
`;

// ---- js/wgsl/scene.js ----
// Reef environment: live rock, sand, corals (with sway), and the water background.

// ---- live rock -------------------------------------------------------------------------------
const ROCK = common() + /* wgsl */ `
struct VIn { @location(0) pos: vec3f, @location(1) nrm: vec3f, @location(2) ao: f32 };
struct VOut { @builtin(position) clip: vec4f, @location(0) world: vec3f, @location(1) nrm: vec3f, @location(2) ao: f32 };

@vertex fn vs(v: VIn) -> VOut {
  var o: VOut;
  o.clip = F.viewProj * vec4f(v.pos, 1.0);
  o.world = v.pos; o.nrm = v.nrm; o.ao = v.ao;
  return o;
}

fn rockHeight(p: vec3f) -> f32 {
  let q1 = ROT3 * p;
  let q2 = ROT3 * q1;
  let q3 = ROT3 * q2;
  return vnoise3(p * 2.6) * 0.9 + vnoise3(q1 * 6.0) * 0.5 + vnoise3(q2 * 14.0 + 3.7) * 0.32 + vnoise3(q3 * 33.0 + 9.1) * 0.18;
}

@fragment fn fs(in: VOut) -> @location(0) vec4f {
  let P = in.world;
  var N = normalize(in.nrm);

  let e = 0.01;
  let h0 = rockHeight(P);
  let g = vec3f(rockHeight(P + vec3f(e, 0.0, 0.0)) - h0, rockHeight(P + vec3f(0.0, e, 0.0)) - h0, rockHeight(P + vec3f(0.0, 0.0, e)) - h0) / e;
  let detailFade = 1.0 - saturate((waterDistance(P) - 3.0) / 12.0);
  N = normalize(N - (g - N * dot(g, N)) * 0.06 * (0.4 + 0.6 * detailFade));

  let n1 = fbm3(P * 0.9);
  var col = mix(srgb(vec3f(0.40, 0.35, 0.28)), srgb(vec3f(0.58, 0.52, 0.42)), n1);
  // muted pink-purple coralline crusts, broken up into small patches
  let corN = fbm3(P * 2.1 + 5.0) + (vnoise3(P * 9.0) - 0.5) * 0.25;
  let cor = smoothstep(0.52, 0.6, corN) * saturate(N.y * 0.5 + 0.7);

  let turf = smoothstep(0.48, 0.64, fbm3(P * 2.4 + 11.0)) * smoothstep(0.4, 0.9, N.y);
  col = mix(col, mix(srgb(vec3f(0.3, 0.34, 0.18)), srgb(vec3f(0.4, 0.34, 0.21)), vnoise3(P * 5.0)), turf * 0.7);
  // small encrusting coral colonies with polyp dimples
  let encN = vnoise3(P * 2.3 + 23.0) + (vnoise3(P * 8.0) - 0.5) * 0.18;
  let enc = smoothstep(0.74, 0.8, encN) * saturate(N.y + 0.8);
  let pick = vnoise3(P * 0.6 + 41.0);
  let encCol = mix(mix(srgb(vec3f(0.62, 0.46, 0.32)), srgb(vec3f(0.5, 0.42, 0.52)), smoothstep(0.35, 0.5, pick)),
                   srgb(vec3f(0.44, 0.52, 0.4)), smoothstep(0.62, 0.75, pick));
  let polyp = smoothstep(0.55, 0.75, vnoise3(P * 70.0));
  col = mix(col, encCol * (0.85 + 0.3 * polyp), enc * 0.85);

  let pore = smoothstep(0.66, 0.86, vnoise3(ROT3 * P * 27.0 + 1.3)) * smoothstep(0.35, 0.65, vnoise3(P * 3.0 + 4.0)) * (1.0 - enc);

  col *= 0.7 + 0.3 * saturate(h0 * 0.6);

  s.albedo = col;
  s.rough = 0.86;
  s.f0 = 0.03;
  s.ao = pow(in.ao, 1.4) * (1.0 - pore * 0.4);
  s.translucency = 0.0;
  s.causticK = 0.8;
  var c = shade(P, N, s, in.clip.xy);
  c = applyWater(c, P);
  return vec4f(c, 1.0);
}
`;

  let w = vnoise2(p * 0.45) * 7.0 + vnoise2(p * 1.3) * 1.5;
  return sin(dot(p, vec2f(0.78, 0.62)) * 8.5 + w);

const CORAL_VS = /* wgsl */ `
struct VIn {
  @location(0) pos: vec3f, @location(1) nrm: vec3f, @location(2) aux: vec4f,
  @location(3) c0: vec4f, @location(4) c1: vec4f, @location(5) c2: vec4f, @location(6) c3: vec4f,
  @location(7) ca: vec4f, @location(8) cb: vec4f,
};
fn isSoft(t: i32) -> bool { return t == 4 || t == 5 || t == 6 || t == 7; }

fn coralWorld(v: VIn) -> vec3f {
  let type_ = i32(v.c0.w + 0.5);
  let M = mat3x3f(v.c0.xyz, v.c1.xyz, v.c2.xyz);
  var lp = v.pos;
  let tt = F.camPos.w;
  let anim = F.current.w;
  if (type_ == 6) { lp += v.nrm * 0.005 * sin(tt * 0.55 + v.aux.z) * anim; }
  if (type_ == 2) { lp.y *= 1.0 + 0.05 * sin(tt * 0.4 + v.c2.w) * anim; }
  var world = v.c3.xyz + M * lp;
  if (isSoft(type_) && anim > 0.5) {
    let w = v.aux.x * v.c1.w;
    let ph = v.aux.z + v.c2.w;
    let cur = F.current.xyz;
    var off = cur * (0.65 + 0.35 * sin(tt * 0.31 + ph * 0.3));
    off += vec3f(sin(tt * 0.77 + ph + world.x * 0.6), 0.25 * sin(tt * 0.55 + ph * 1.7), cos(tt * 0.63 + ph * 1.3 + world.z * 0.5)) * 0.45;
    var amp = 0.045;
    if (type_ == 4) { amp = 0.07; } else if (type_ == 5) { amp = 0.035; } else if (type_ == 6) { amp = 0.0; }
    world += off * w * amp * length(v.c1.xyz);
  }
  return world;
}
`;

const CORAL = common() + CORAL_VS + /* wgsl */ `
struct VOut {
  @builtin(position) clip: vec4f,
  @location(0) world: vec3f,
  @location(1) nrm: vec3f,
  @location(2) aux: vec4f,
  @location(3) lp: vec3f,
  @location(4) @interpolate(flat) ca: vec4f,
  @location(5) @interpolate(flat) cb: vec4f,
  @location(6) @interpolate(flat) info: vec4f, // type, ao, phase, scale
};

@vertex fn vs(v: VIn) -> VOut {
  let M = mat3x3f(v.c0.xyz, v.c1.xyz, v.c2.xyz);
  let world = coralWorld(v);
  var o: VOut;
  o.clip = F.viewProj * vec4f(world, 1.0);
  o.world = world;
  o.nrm = normalize(M * v.nrm);
  o.aux = v.aux;
  o.lp = v.pos;
  o.ca = v.ca; o.cb = v.cb;
  o.info = vec4f(v.c0.w, v.c3.w, v.c2.w, length(v.c1.xyz));
  return o;
}

fn stripesC(q: f32, duty: f32) -> f32 {
  let fw = fwidth(q);
  let d = abs(fract(q) - 0.5) * 2.0;
  return mix(1.0 - smoothstep(duty - fw, duty + fw, d), duty, saturate(fw * 1.5 - 0.3));
}

@fragment fn fs(in: VOut, @builtin(front_facing) front: bool) -> @location(0) vec4f {
  let type_ = i32(in.info.x + 0.5);

  let lp = in.lp;
  let A = in.ca.rgb; let B = in.cb.rgb;
  var col = A;

  var transl = 0.1;

  switch (type_) {
    case 0, 8: {
      // staghorn and finger: pale growing tips, corallite pits
      let tip = in.aux.y;
      col = mix(A, B, smoothstep(select(0.5, 0.6, type_ == 8), 1.0, tip));
      let d = vnoise3(lp * select(70.0, 95.0, type_ == 8));
      let pit = smoothstep(0.62, 0.78, d) * near;

      ao *= mix(0.6, 1.0, smoothstep(0.0, 0.5, tip + lp.y * 0.6));
      rough = 0.62;
    }
    case 1: {
      // brain coral: meandering valleys traced as contour lines of a warped noise field
      let wp = lp * 5.5 + vec3f(vnoise3(lp * 2.0), vnoise3(lp * 2.0 + 5.0), vnoise3(lp * 2.0 + 9.0)) * 1.2;
      let n = fbm3(wp);

      let valley = 1.0 - smoothstep(0.25, 0.6, val);
      let septa = stripesC((wp.x + wp.y * 0.7 + wp.z * 0.4) * 6.0, 0.3) * (1.0 - valley);
      col = mix(A, B, valley);
      col *= 1.0 - septa * 0.18 * near;
      let gx = dpdx(valley); let gy = dpdy(valley);
      N = normalize(N + (normalize(dpdx(in.world)) * gx + normalize(dpdy(in.world)) * gy) * 2.5 * near);
      ao *= 1.0 - valley * 0.35;
      rough = 0.55;
    }
    case 2: {
      // mushroom: radial septa, a pale mouth and fleshy speckles
      let r = in.aux.y;
      let septa = stripesC(in.aux.z * 28.0 / 6.2831, 0.35);
      col = mix(A, A * 1.25, septa * 0.4);
      col = mix(col, B, smoothstep(0.6, 0.8, vnoise3(lp * 18.0)) * 0.6);
      col = mix(col, B * 1.2, 1.0 - smoothstep(0.05, 0.12, r));
      if (in.aux.w > 0.5) { col = A * 0.5; }
      rough = 0.4; transl = 0.3;
    }
    case 3: {
      // plating coral: growth rings, lighter growing edge, polyp pores
      let r = in.aux.y;
      let rings = stripesC(r * 13.0, 0.3);
      col = mix(A, B, smoothstep(0.78, 1.0, r));
      col *= 0.9 + 0.1 * rings;
      col *= 1.0 - smoothstep(0.65, 0.8, vnoise3(lp * 85.0)) * 0.3 * near;
      if (in.aux.w < 0.5) { col *= 0.6; ao *= 0.6; }
      rough = 0.6;
    }
    case 4: {
      // gorgonian fan: polyp speckles along the branches
      col = mix(A, B, smoothstep(0.55, 0.8, vnoise3(lp * 120.0)) * 0.8);
      rough = 0.7; transl = 0.35;
    }
    case 5: {
      // toadstool leather: extended polyps make the cap look furry
      if (in.aux.w > 0.75) {
        let fuzz = vnoise3(lp * 110.0);
        col = mix(A, B, smoothstep(0.45, 0.85, fuzz));
        N = normalize(N + (vec3f(fuzz, vnoise3(lp * 110.0 + 4.0), vnoise3(lp * 110.0 + 8.0)) - 0.5) * 0.6 * near);
      } else if (in.aux.w > 0.25) {
        col = A * 0.75;
      } else {
        col = mix(B, A, 0.3) * (0.95 + 0.1 * stripesC(lp.y * 40.0, 0.4));
      }
      rough = 0.7; transl = 0.3;
    }
    case 6: {
      // bubble coral vesicles: pearly and translucent
      col = mix(A, B, in.aux.y);
      rough = 0.28; transl = 0.85;
      let V = normalize(F.camPos.xyz - in.world);
      col *= 0.85 + 0.35 * pow(1.0 - saturate(dot(N, V)), 2.0);
    }
    case 7: {
      if (in.aux.w > 0.5) {

        col = mix(A, B, smoothstep(0.55, 0.92, in.aux.y));

      } else {
        col = A * 0.65 * (0.9 + 0.2 * stripesC(atan2(lp.z, lp.x) * 4.0, 0.4));
        rough = 0.5; transl = 0.3;
      }
    }
    case 9: {
      col = mix(A, B, fbm3(lp * 7.0 + in.info.z));

  s.albedo = col;
  s.rough = rough;
  s.f0 = 0.035;
  s.ao = ao;
  s.translucency = transl;
  s.causticK = 1.0;
  var c = shade(in.world, N, s, in.clip.xy);
  c = applyWater(c, in.world);
  return vec4f(c, 1.0);
}
`;

// Suspended particles, bubble streams, and volumetric light shafts. Particles and bubbles

const BUBBLES_PER_SOURCE = 40;

fn quadCorner(vi: u32) -> vec2f {
  var c = array<vec2f, 6>(vec2f(-1.0, -1.0), vec2f(1.0, -1.0), vec2f(1.0, 1.0), vec2f(-1.0, -1.0), vec2f(1.0, 1.0), vec2f(-1.0, 1.0));
  return c[vi];
}
// world size of one pixel at distance d
fn pixelWorld(d: f32) -> f32 { return d * 2.0 / (F.screen.w * F.screen.y); }

const PARTICLES = common() + QUAD + /* wgsl */ `
struct VOut {
  @builtin(position) clip: vec4f,
  @location(0) uv: vec2f,
  @location(1) @interpolate(flat) col: vec4f,
};
@vertex fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VOut {
  let id = f32(ii);
  let h = vec3f(hash11(id * 1.37 + 0.1), hash11(id * 2.11 + 3.3), hash11(id * 3.77 + 7.7));
  let h2 = hash11(id * 5.31 + 1.9);
  let t = F.camPos.w;
  let box0 = vec3f(-11.0, 0.05, -8.0);
  let size = vec3f(22.0, 7.7, 7.95);
  var p = h * size;
  p += F.drift.xyz;
  p += vec3f(sin(t * 0.07 + id) * 0.25 + t * 0.004, -t * (0.004 + h2 * 0.01) + sin(t * 0.05 + id * 1.7) * 0.2, cos(t * 0.06 + id * 2.3) * 0.25);
  p = box0 + fract(p / size) * size;
  let toCam = F.camPos.xyz - p;
  let dist = length(toCam);
  let fwd = toCam / dist;
  let right = normalize(cross(vec3f(0.0, 1.0, 0.0), fwd));
  let up = cross(fwd, right);
  let r = mix(0.005, 0.017, h.x * h.x);
  let rr = max(r, pixelWorld(dist) * 0.9);
  let c = quadCorner(vi);
  let world = p + (right * c.x + up * c.y) * rr;
  var o: VOut;
  o.clip = F.viewProj * vec4f(world, 1.0);
  o.uv = c;
  // drifting flecks occasionally catch the light
  let sparkle = pow(saturate(sin(t * (0.3 + h2 * 0.6) + id * 3.1) * 0.5 + 0.5), 12.0);
  let lit = (0.35 + 0.9 * sparkle) * depthAttenuation(p.y);
  let d = waterDistance(p);
  let fog = exp(-d * 0.11 / max(F.deep.w, 0.2));
  let a = 0.42 * (r / rr) * (r / rr) * fog * smoothstep(0.6, 1.6, dist) * (1.0 - smoothstep(-0.25, -0.05, p.z));
  let col = applyWater(vec3f(0.78, 0.86, 0.84) * lit * F.lightDir.w * 0.6, p);

  let d = length(in.uv);

  return vec4f(in.col.rgb * a, a);
}
`;

struct VOut {
  @builtin(position) clip: vec4f,
  @location(0) uv: vec2f,
  @location(1) @interpolate(flat) col: vec4f,
};
@vertex fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VOut {
  var o: VOut;
  let stream = ii / ${BUBBLES_PER_SOURCE}u;
  let k = f32(ii % ${BUBBLES_PER_SOURCE}u);
  let src = F.src[stream];
  o.clip = vec4f(2.0, 2.0, 2.0, 1.0);
  o.uv = vec2f(0.0);
  o.col = vec4f(0.0);
  if (src.w < 0.5) { return o; }
  let seed = k + f32(stream) * 101.0;
  let h = vec3f(hash11(seed * 1.73 + 0.3), hash11(seed * 2.91 + 5.1), hash11(seed * 4.37 + 9.2));
  let t = F.camPos.w;

  let spawn = floor(cyc);

  let env = smoothstep(0.42, 0.62, vnoise2(vec2f((spawn * period) * 0.012, f32(stream) * 3.7)));
  if (hash11(spawn * 7.13 + seed) > env * 0.95) { return o; }
  let wob = sin(ph * 22.0 + h.z * 6.28) * 0.025 * (0.3 + ph);
  var p = vec3f(src.x + wob, y0 + ph * height, src.z + cos(ph * 19.0 + h.y * 6.28) * 0.02 * (0.3 + ph));
  p += F.current.xyz * ph * 0.6;
  let r = mix(0.007, 0.024, h.z * h.z) * (1.0 + ph * 0.3);
  let toCam = F.camPos.xyz - p;
  let dist = length(toCam);
  let fwd = toCam / dist;
  let right = normalize(cross(vec3f(0.0, 1.0, 0.0), fwd));
  let up = cross(fwd, right);
  let rr = max(r, pixelWorld(dist) * 1.2);
  let c = quadCorner(vi);
  o.clip = F.viewProj * vec4f(p + (right * c.x + up * c.y) * rr, 1.0);
  o.uv = c;
  let lit = sunColor() * depthAttenuation(p.y);

    const h = t1 - t0, s = (t - t0) / h;
    const s2 = s * s, s3 = s2 * s;
    return (2 * s3 - 3 * s2 + 1) * v0 + (s3 - 2 * s2 + s) * h * tan[i] + (-2 * s3 + 3 * s2) * v1 + (s3 - s2) * h * tan[i + 1];
  };
}

// Reverse any triangle whose counter-clockwise face normal points against its vertex normals,
// so front_facing in the shaders means "the side the normals point to".
function orientTriangles(vertices, stride, indices) {
  for (let t = 0; t < indices.length; t += 3) {
    const a = indices[t] * stride, b = indices[t + 1] * stride, c = indices[t + 2] * stride;
    const ux = vertices[b] - vertices[a], uy = vertices[b + 1] - vertices[a + 1], uz = vertices[b + 2] - vertices[a + 2];
    const vx = vertices[c] - vertices[a], vy = vertices[c + 1] - vertices[a + 1], vz = vertices[c + 2] - vertices[a + 2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const sx = vertices[a + 3] + vertices[b + 3] + vertices[c + 3];
    const sy = vertices[a + 4] + vertices[b + 4] + vertices[c + 4];
    const sz = vertices[a + 5] + vertices[b + 5] + vertices[c + 5];
    if (nx * sx + ny * sy + nz * sz < 0) { const k = indices[t + 1]; indices[t + 1] = indices[t + 2]; indices[t + 2] = k; }
  }
  return indices;
}

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  const v = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
  return [((v >> 16) & 255) / 255, ((v >> 8) & 255) / 255, (v & 255) / 255];
}
const srgbToLinear = (c) => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));

function deepMerge(base, over) {
  for (const k of Object.keys(over || {})) {
    const v = over[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object') deepMerge(base[k], v);
    else base[k] = v;
  }
  return base;
}

function coerce(old, s) {
  if (typeof old === 'number') { const n = Number(s); return Number.isFinite(n) ? n : old; }
  if (typeof old === 'boolean') return s === '1' || s === 'true' || s === 'on';
  return s;
}

function loadConfig(search = location.search) {
  const cfg = deepMerge({}, JSON.parse(JSON.stringify(DEFAULT_CONFIG)));
  const qs = new URLSearchParams(search);
  const packed = qs.get('config');
  if (packed) {
    try {
      const json = atob(packed.replace(/-/g, '+').replace(/_/g, '/'));
      deepMerge(cfg, JSON.parse(json));
    } catch (e) { console.warn('ignored malformed ?config', e); }
  }
  for (const [key, value] of qs) {
    if (!key.includes('.')) continue;
    const path = key.split('.');
    let o = cfg;
    for (let i = 0; i < path.length - 1 && o; i++) o = o[path[i]];
    if (!o || typeof o !== 'object') continue;
    const leaf = path[path.length - 1];
    o[leaf] = leaf in o ? coerce(o[leaf], value) : (Number.isFinite(Number(value)) ? Number(value) : value);
  }
  return cfg;
}

// Scale the species distribution to the configured population, keeping at most one eel
// and at least one of every listed species while there is room.
function resolvePopulation(cfg) {
  const dist = { ...cfg.fish.speciesDistribution };
  const target = Math.max(0, Math.round(cfg.fish.population));
  const total = Object.values(dist).reduce((a, b) => a + b, 0);
  if (!total || target === total) return dist;
  const out = {};
  const keys = Object.keys(dist).filter((k) => dist[k] > 0);
  let assigned = 0;
  const rema = [];
  for (const k of keys) {
    const exact = (dist[k] * target) / total;
    out[k] = Math.floor(exact);
    rema.push([exact - out[k], k]);
    assigned += out[k];
  }
  rema.sort((a, b) => b[0] - a[0]);
  for (let i = 0; assigned < target && i < rema.length * 4; i++) { out[rema[i % rema.length][1]]++; assigned++; }
  if (out.morayEel > 1) out.morayEel = 1;
  return out;
}
