// ---- js/fish-mesh.js ----
// Procedural fish geometry. Each species is lofted from its dorsal, ventral and width
// profiles, then given membrane fins, domed eyes and (for the moray) a hinged lower jaw.
//
// Vertex layout (14 floats): position xyz, normal xyz, body uv (t, y), aux xyzw, texture uv.
//   aux.x  part: 0 body, 1 caudal, 2 dorsal, 3 anal, 4 pectoral, 5 pelvic, 6 eye
//   aux.y  side: -1 left, +1 right, 0 on the midline
//   body:  aux.z normalized height (-1 belly .. 1 back), aux.w jaw weight
//   fins:  aux.z distance from the fin base (0 .. 1), aux.w position across the span (0 .. 1)
//   eye:   aux.z radius from the pupil centre (0 .. 1)
// Local frame: +x forward (snout), +y up, +z the fish's right side. One unit = body length.

const FISH_STRIDE = 14;

const sgnpow = (v, p) => Math.sign(v) * Math.pow(Math.abs(v), p);

function buildFishMesh(def) {
  const g = def.geo;
  const top = curve(g.top), bot = curve(g.bot), wid = curve(g.width);
  const n = g.n, pivot = g.pivot ?? (def.id === 11 ? 0.05 : 0.4);
  const P = [], UV = [], AUX = [], TEX = [], FIXN = [];
  const idx = [];
  const center = (t) => (top(t) + bot(t)) / 2;
  const half = (t) => Math.max(1e-4, (top(t) - bot(t)) / 2);
  // body surface z at (t, y): positive side
  const surfZ = (t, y) => {
    const v = Math.min(0.999, Math.abs((y - center(t)) / half(t)));
    return wid(t) * Math.pow(1 - Math.pow(v, n), 1 / n);
  };
  function vert(t, y, z, aux, uvY = y, fixN = null, tex = null) {
    P.push(t, y, z);
    UV.push(t, uvY);
    AUX.push(aux[0], aux[1], aux[2], aux[3]);
    TEX.push(tex ? tex[0] : 0, tex ? tex[1] : 0);
    FIXN.push(fixN);
    return P.length / 3 - 1;
  }
  const quad = (a, b, c, d) => { idx.push(a, b, c, a, c, d); };

  // ---- body -----------------------------------------------------------------------------
  const tPed = g.tPed;
  const R = g.rings ?? 72;
  const K = 40; // around; K/2 must land on theta = pi
  const jaw = g.jaw;
  const ringStart = [];
  const t0 = 0.004 * tPed;
  for (let i = 0; i < R; i++) {
    const s = i / (R - 1);
    const t = t0 + (tPed - t0) * Math.pow(s, 1.25);
    const c = center(t), hh = half(t), w = Math.max(1e-4, wid(t));
    ringStart.push(P.length / 3);
    // upper half j = 0..K/2, lower half j = K/2..K (duplicated seam vertices)
    for (let half_ = 0; half_ < 2; half_++) {
      for (let j = 0; j <= K / 2; j++) {
        const th = (Math.PI * 2 * (j + half_ * (K / 2))) / K;
        const cs = Math.cos(th), sn = Math.sin(th);
        const y = c + hh * sgnpow(sn, 2 / n);
        const z = w * sgnpow(cs, 2 / n);
        const lower = half_ === 1;
        let jw = 0;
        if (jaw && lower && t < jaw.t) jw = Math.min(1, (jaw.t - t) / 0.02);
        const side = Math.abs(cs) < 1e-6 ? 0 : Math.sign(cs);
        vert(t, y, z, [0, side, (y - c) / hh, jw], y, null, jaw && lower ? [pivot - jaw.t, jaw.y] : null);
      }
    }
  }
  const H = K / 2 + 1; // vertices per half ring
  for (let i = 0; i < R - 1; i++) {
    for (let h = 0; h < 2; h++) {
      const a0 = ringStart[i] + h * H, b0 = ringStart[i + 1] + h * H;
      for (let j = 0; j < K / 2; j++) quad(a0 + j, b0 + j, b0 + j + 1, a0 + j + 1);
    }
  }
  // snout tips (upper and lower) and tail cap
  {
    const c0 = center(0);
    for (let h = 0; h < 2; h++) {
      const jw = jaw && h === 1 ? 1 : 0;
      const tip = vert(0, c0, 0, [0, 0, 0, jw], c0, null, jaw && h === 1 ? [pivot - jaw.t, jaw.y] : null);
      const a0 = ringStart[0] + h * H;
      for (let j = 0; j < K / 2; j++) idx.push(tip, a0 + j + 1, a0 + j);
    }
    const cT = center(tPed);
    for (let h = 0; h < 2; h++) {
      const cap = vert(tPed + 0.004, cT, 0, [0, 0, 0, 0], cT);
      const a0 = ringStart[R - 1] + h * H;
      for (let j = 0; j < K / 2; j++) idx.push(cap, a0 + j, a0 + j + 1);
    }
  }
  const bodyEnd = P.length / 3;

  // ---- fin membranes ----------------------------------------------------------------------
  function membrane(cols, rows, fn) {
    const base = P.length / 3;
    for (let r = 0; r <= rows; r++) for (let c = 0; c <= cols; c++) fn(c / cols, r / rows);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const a = base + r * (cols + 1) + c;
        quad(a, a + 1, a + cols + 2, a + cols + 1);
      }
    }
  }
  // aux.w carries s + 2 * segment so the shader can tell a spiny first dorsal from the soft one
  function medianFin(f, part, seg) {
    const hC = curve(f.h), swC = curve(f.sweep);
    const rows = Math.max(10, Math.round((f.to - f.from) * 90)) + (f.spines ? f.spines * 4 : 0);
    const up = part === 2 ? 1 : -1;
    membrane(7, rows, (u, s) => {
      const tb = f.from + s * (f.to - f.from);
      const yb = (up > 0 ? top(tb) : bot(tb)) - up * 0.006;
      const tt = tb + swC(s) * u;
      const yt = yb + up * (hC(s) + 0.006) * u;
      vert(tt, yt, 0, [part, 0, u, Math.min(s, 0.999) + 2 * seg]);
    });
  }
  (g.dorsal || []).forEach((f, k) => medianFin(f, 2, k));
  (g.anal || []).forEach((f, k) => medianFin(f, 3, k));

  if (g.caudal) {
    const cf = g.caudal;
    const cT = center(tPed), hb = half(tPed) * 0.95;
    const shape = {
      rounded: (v) => Math.sqrt(Math.max(0, 1 - 0.6 * v * v)),
      truncate: (v) => 0.97 + 0.06 * v * v,
      emarginate: (v) => 0.86 + 0.14 * Math.pow(Math.abs(v), 1.5),
      forked: (v) => 0.5 + 0.5 * Math.pow(Math.abs(v), 1.2),
      lunate: (v) => 0.4 + 0.6 * Math.pow(Math.abs(v), 1.6),
      lyre: (v) => 0.32 + 0.68 * Math.pow(Math.abs(v), 2.6),
    }[cf.type];
    const spanK = cf.type === 'rounded' ? 0.92 : 1;
    membrane(9, 26, (u, s) => {
      const v = s * 2 - 1;
      const tb = tPed - 0.025, yb = cT + v * hb;
      const tt = tPed + cf.len * shape(v), yt = cT + v * cf.span * spanK;
      // slight concave bulge so the fin is not a perfect ruled surface
      const t = tb + (tt - tb) * u, y = yb + (yt - yb) * Math.pow(u, 0.85);
      vert(t, y, 0, [1, 0, u, s]);
    });
  }

  function pairedFin(f, part) {
    if (!f) return;
    const shapeC = curve(f.shape);
    const rows = Math.max(12, (f.rays || 9) * 2);
    for (const side of [-1, 1]) {
      const zh = surfZ(f.t, f.y) * (part === 5 ? 0.55 : 0.92);
      const tau = (f.tilt * Math.PI) / 180;
      membrane(7, rows, (u, s) => {
        const a = ((f.a0 + s * (f.a1 - f.a0)) * Math.PI) / 180;
        let dx = Math.cos(a) * Math.cos(tau), dy = Math.sin(a), dz = Math.cos(a) * Math.sin(tau);
        const l = Math.hypot(dx, dy, dz); dx /= l; dy /= l; dz /= l;
        const L = f.len * shapeC(s) * u;
        const t = f.t + dx * L, y = f.y + (s - 0.5) * f.base * (1 - u * 0.6) + dy * L;
        vert(t, y, side * (zh + dz * L), [part, side, u, s]);
      });
    }
  }
  pairedFin(g.pectoral, 4);
  pairedFin(g.pelvic, 5);
  const finEnd = P.length / 3;

  // ---- eyes (explicit normals) ------------------------------------------------------------
  if (g.eye) {
    const e = g.eye;
    const zs = surfZ(e.t, e.y);
    const rings = 7, segs = 20, phiMax = (82 * Math.PI) / 180;
    for (const side of [-1, 1]) {
      const base = P.length / 3;
      const cz = zs - e.r * 0.28;
      for (let k = 0; k <= rings; k++) {
        const phi = (k / rings) * phiMax;
        for (let m = 0; m < segs; m++) {
          const psi = (m / segs) * Math.PI * 2;
          const nt = Math.sin(phi) * Math.cos(psi), ny = Math.sin(phi) * Math.sin(psi), nz = Math.cos(phi);
          // flatter dome so it sits in the head instead of bulging like a bead
          const t = e.t + e.r * nt, y = e.y + e.r * ny, z = side * (cz + e.r * nz * 0.75);
          vert(t, y, z, [6, side, Math.sin(phi) / Math.sin(phiMax), psi], y, [nt, ny, side * nz]);
        }
      }
      for (let k = 0; k < rings; k++) {
        for (let m = 0; m < segs; m++) {
          const a = base + k * segs + m, b = base + k * segs + ((m + 1) % segs);
          quad(a, a + segs, b + segs, b);
        }
      }
    }
  }

  // ---- convert t to local x, compute normals ----------------------------------------------
  const nv = P.length / 3;
  const pos = new Float32Array(nv * 3);
  for (let i = 0; i < nv; i++) {
    pos[i * 3] = pivot - P[i * 3];
    pos[i * 3 + 1] = P[i * 3 + 1];
    pos[i * 3 + 2] = P[i * 3 + 2];
  }
  const nrm = new Float32Array(nv * 3);
  for (let k = 0; k < idx.length; k += 3) {
    const a = idx[k] * 3, b = idx[k + 1] * 3, c = idx[k + 2] * 3;
    const ux = pos[b] - pos[a], uy = pos[b + 1] - pos[a + 1], uz = pos[b + 2] - pos[a + 2];
    const vx = pos[c] - pos[a], vy = pos[c + 1] - pos[a + 1], vz = pos[c + 2] - pos[a + 2];
    const fx = uy * vz - uz * vy, fy = uz * vx - ux * vz, fz = ux * vy - uy * vx;
    for (const o of [a, b, c]) { nrm[o] += fx; nrm[o + 1] += fy; nrm[o + 2] += fz; }
  }
  // weld the duplicated seam normals so the body shades smoothly across the seam
  for (let i = 0; i < R; i++) {
    const s = ringStart[i];
    const pairs = [[s, s + H + K / 2], [s + K / 2, s + H]];
    for (const [a, b] of pairs) {
      for (let c = 0; c < 3; c++) { const m = nrm[a * 3 + c] + nrm[b * 3 + c]; nrm[a * 3 + c] = m; nrm[b * 3 + c] = m; }
    }
  }
  for (let i = 0; i < nv; i++) {
    const o = i * 3;
    if (FIXN[i]) { nrm[o] = -FIXN[i][0]; nrm[o + 1] = FIXN[i][1]; nrm[o + 2] = FIXN[i][2]; continue; }
    let x = nrm[o], y = nrm[o + 1], z = nrm[o + 2];
    const l = Math.hypot(x, y, z) || 1;
    x /= l; y /= l; z /= l;
    if (i < bodyEnd) {
      // body normals point away from the spine
      const t = P[o], ry = P[o + 1] - center(Math.min(t, tPed)), rz = P[o + 2];
      if (ry * y + rz * z < 0 && Math.abs(ry) + Math.abs(rz) > 1e-5) { x = -x; y = -y; z = -z; }
    } else if (i < finEnd && z < 0 && AUX[i * 4 + 1] === 0) {
      // median fins face +z by convention (the shader flips back faces)
      x = -x; y = -y; z = -z;
    }
    nrm[o] = x; nrm[o + 1] = y; nrm[o + 2] = z;
  }

  const v = new Float32Array(nv * FISH_STRIDE);
  for (let i = 0; i < nv; i++) {
    const o = i * FISH_STRIDE;
    v[o] = pos[i * 3]; v[o + 1] = pos[i * 3 + 1]; v[o + 2] = pos[i * 3 + 2];
    v[o + 3] = nrm[i * 3]; v[o + 4] = nrm[i * 3 + 1]; v[o + 5] = nrm[i * 3 + 2];
    v[o + 6] = UV[i * 2]; v[o + 7] = UV[i * 2 + 1];
    v[o + 8] = AUX[i * 4]; v[o + 9] = AUX[i * 4 + 1]; v[o + 10] = AUX[i * 4 + 2]; v[o + 11] = AUX[i * 4 + 3];
    v[o + 12] = TEX[i * 2]; v[o + 13] = TEX[i * 2 + 1];
  }
  let maxH = 0, maxW = 0;
  for (let t = 0; t <= tPed; t += 0.01) { maxH = Math.max(maxH, half(t)); maxW = Math.max(maxW, wid(t)); }
  return { vertices: v, indices: orientTriangles(v, FISH_STRIDE, new Uint32Array(idx)), maxHalfHeight: maxH, maxHalfWidth: maxW, pivot };
}

// ---- js/coral-mesh.js ----
// Procedural coral, anemone, stone and shell meshes. Each generator returns one variant;
// the reef instances a few variants per type with their own transforms and colours.
//
// Vertex layout (10 floats): position xyz, normal xyz, aux xyzw.
//   aux.x  sway weight (0 = rigid base, 1 = free tip), used by soft corals
//   aux.y  type parameter (tip factor, plate radius, tentacle length position, ...)
//   aux.z  per-element phase in radians (tentacle, vesicle, branch)
//   aux.w  type flag (anemone: 1 tentacle, 0 body; leather: 1 cap)

const CORAL_STRIDE = 10;
const CORAL_TYPES = {
  staghorn: 0, brain: 1, mushroom: 2, plate: 3, fan: 4, leather: 5, bubble: 6, anemone: 7, finger: 8, stone: 9, shell: 10,
};
const SOFT_TYPES = new Set([4, 5, 6, 7]);

class MeshBuilder {
  constructor() { this.v = []; this.i = []; }
  get count() { return this.v.length / CORAL_STRIDE; }
  add(px, py, pz, nx, ny, nz, a = 0, b = 0, c = 0, d = 0) {
    const l = Math.hypot(nx, ny, nz) || 1;
    this.v.push(px, py, pz, nx / l, ny / l, nz / l, a, b, c, d);
    return this.count - 1;
  }
  tri(a, b, c) { this.i.push(a, b, c); }
  quad(a, b, c, d) { this.i.push(a, b, c, a, c, d); }
  // Tube along points [{p:[x,y,z], r, aux:[a,b,c,d]}], optional rounded tip.
  tube(pts, sides, capTip = true) {
    const n = pts.length;
    const tangents = pts.map((_, k) => {
      const a = pts[Math.max(0, k - 1)].p, b = pts[Math.min(n - 1, k + 1)].p;
      const t = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
      const l = Math.hypot(...t) || 1;
      return [t[0] / l, t[1] / l, t[2] / l];
    });
    // parallel-transported frame
    let t0 = tangents[0];
    let ref = Math.abs(t0[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
    let u = cross(t0, ref); u = norm(u);
    let w = cross(t0, u);
    const start = this.count;
    for (let k = 0; k < n; k++) {
      const t = tangents[k];
      if (k > 0) {
        // remove the component along the new tangent
        const d = dot(u, t);
        u = norm([u[0] - t[0] * d, u[1] - t[1] * d, u[2] - t[2] * d]);
        w = cross(t, u);
      }
      const { p, r, aux } = pts[k];
      for (let s = 0; s < sides; s++) {
        const a = (s / sides) * TAU, ca = Math.cos(a), sa = Math.sin(a);
        const nx = u[0] * ca + w[0] * sa, ny = u[1] * ca + w[1] * sa, nz = u[2] * ca + w[2] * sa;
        this.add(p[0] + nx * r, p[1] + ny * r, p[2] + nz * r, nx, ny, nz, aux[0], aux[1], aux[2], aux[3]);
      }
    }
    for (let k = 0; k < n - 1; k++) {
      for (let s = 0; s < sides; s++) {
        const a = start + k * sides + s, b = start + k * sides + ((s + 1) % sides);
        this.quad(a, b, b + sides, a + sides);
      }
    }
    if (capTip) {
      // hemispherical cap
      const last = pts[n - 1], t = tangents[n - 1];
      let prev = start + (n - 1) * sides;
      const rings = 3;
      for (let q = 1; q <= rings; q++) {
        const ph = (q / rings) * (Math.PI / 2);
        const rr = last.r * Math.cos(ph), off = last.r * Math.sin(ph);
        const ring = this.count;
        for (let s = 0; s < sides; s++) {
          const a = (s / sides) * TAU, ca = Math.cos(a), sa = Math.sin(a);
          const rx = u[0] * ca + w[0] * sa, ry = u[1] * ca + w[1] * sa, rz = u[2] * ca + w[2] * sa;
          const nx = rx * Math.cos(ph) + t[0] * Math.sin(ph), ny = ry * Math.cos(ph) + t[1] * Math.sin(ph), nz = rz * Math.cos(ph) + t[2] * Math.sin(ph);
          this.add(last.p[0] + rx * rr + t[0] * off, last.p[1] + ry * rr + t[1] * off, last.p[2] + rz * rr + t[2] * off,
            nx, ny, nz, last.aux[0], last.aux[1], last.aux[2], last.aux[3]);
        }
        for (let s = 0; s < sides; s++) {
          const a = prev + s, b = prev + ((s + 1) % sides);
          this.quad(a, b, ring + ((s + 1) % sides), ring + s);
        }
        prev = ring;
      }
    }
  }
  finish(extra = {}) {
    const vertices = new Float32Array(this.v);
    return { vertices, indices: orientTriangles(vertices, CORAL_STRIDE, new Uint32Array(this.i)), ...extra };
  }
}
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const rotateTowards = (dir, rng, maxAngle) => {
  // random direction within a cone around dir
  const ref = Math.abs(dir[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
  const u = norm(cross(dir, ref)), w = cross(dir, u);
  const a = rng.next() * TAU, b = maxAngle * Math.sqrt(rng.next());
  const s = Math.sin(b), c = Math.cos(b);
  return norm([
    dir[0] * c + (u[0] * Math.cos(a) + w[0] * Math.sin(a)) * s,
    dir[1] * c + (u[1] * Math.cos(a) + w[1] * Math.sin(a)) * s,
    dir[2] * c + (u[2] * Math.cos(a) + w[2] * Math.sin(a)) * s,
  ]);
};

// ---- branching staghorn (Acropora) -----------------------------------------------------
function staghorn(seed) {
  const rng = new Rng(seed);
  const m = new MeshBuilder();
  const branch = (p, dir, len, r, depth) => {
    const segs = Math.max(3, Math.round(len / 0.05));
    const pts = [];
    let d = dir.slice(), q = p.slice();
    const tipR = Math.max(0.011, r * 0.55);
    const terminal = depth === 0 || len < 0.1;
    for (let k = 0; k <= segs; k++) {
      const u = k / segs;
      const rr = r + (tipR - r) * u;
      pts.push({ p: q.slice(), r: rr, aux: [0, terminal ? u * u : u * 0.25, 0, 0] });
      d = norm([d[0] + (rng.next() - 0.5) * 0.18, d[1] + (rng.next() - 0.5) * 0.18 + 0.04, d[2] + (rng.next() - 0.5) * 0.18]);
      q = [q[0] + d[0] * (len / segs), q[1] + d[1] * (len / segs), q[2] + d[2] * (len / segs)];
    }
    m.tube(pts, 8, terminal);
    if (terminal) return;
    const kids = 1 + rng.int(3);
    for (let c = 0; c < kids; c++) {
      const at = Math.floor(segs * (0.45 + rng.next() * 0.5));
      const bp = pts[at].p;
      const nd = rotateTowards(norm([d[0], d[1] + 0.3, d[2]]), rng, 0.45 + rng.next() * 0.35);
      branch(bp, nd, len * (0.55 + rng.next() * 0.3), pts[at].r * 0.85, depth - 1);
    }
    // main axis continues
    branch(q, rotateTowards(d, rng, 0.25), len * 0.7, tipR * 1.05, depth - 1);
  };
  const trunks = 4 + rng.int(4);
  for (let k = 0; k < trunks; k++) {
    const a = rng.next() * TAU, rr = rng.next() * 0.12;
    const dir = rotateTowards([0, 1, 0], rng, 0.75);
    branch([Math.cos(a) * rr, -0.04, Math.sin(a) * rr], dir, 0.32 + rng.next() * 0.2, 0.034, 3);
  }
  return m.finish({ height: 1.0, radius: 0.55 });
}

// ---- finger coral -----------------------------------------------------------------------
function finger(seed) {
  const rng = new Rng(seed);
  const m = new MeshBuilder();
  const count = 10 + rng.int(12);
  for (let k = 0; k < count; k++) {
    const a = rng.next() * TAU, rr = Math.sqrt(rng.next()) * 0.22;
    const base = [Math.cos(a) * rr, -0.03, Math.sin(a) * rr];
    let d = norm([base[0] * 1.2, 1, base[2] * 1.2]);
    const len = 0.22 + rng.next() * 0.25 - rr * 0.4;
    const r = 0.032 + rng.next() * 0.014;
    const pts = [];
    const segs = 8;
    let q = base.slice();
    for (let s = 0; s <= segs; s++) {
      const u = s / segs;
      pts.push({ p: q.slice(), r: r * (1 - 0.15 * u) * (s === 0 ? 1.3 : 1), aux: [0, u, 0, 0] });
      d = norm([d[0] + (rng.next() - 0.5) * 0.12, d[1], d[2] + (rng.next() - 0.5) * 0.12]);
      q = [q[0] + d[0] * len / segs, q[1] + d[1] * len / segs, q[2] + d[2] * len / segs];
    }
    m.tube(pts, 10, true);
  }
  return m.finish({ height: 0.5, radius: 0.3 });
}

// ---- brain coral dome (grooves are drawn per pixel) -------------------------------------
function brain(seed) {
  const rng = new Rng(seed);
  const noise = makeNoise(seed);
  const m = new MeshBuilder();
  const rows = 40, cols = 80;
  const squash = 0.62 + rng.next() * 0.15;
  for (let r = 0; r <= rows; r++) {
    const lat = -0.25 + (r / rows) * (Math.PI / 2 + 0.25);
    for (let c = 0; c <= cols; c++) {
      const lon = (c / cols) * TAU;
      let x = Math.cos(lat) * Math.cos(lon), y = Math.sin(lat), z = Math.cos(lat) * Math.sin(lon);
      const bump = 1 + 0.08 * noise.n3(x * 1.7, y * 1.7, z * 1.7);
      x *= bump; z *= bump; y = y * squash * bump;
      const ny = y / (squash * squash);
      m.add(x * 0.5, y * 0.5, z * 0.5, x, ny, z, 0, 0, 0, 0);
    }
  }
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const a = r * (cols + 1) + c;
      m.quad(a, a + cols + 1, a + cols + 2, a + 1);
    }
  }
  // top cap
  return m.finish({ height: 0.5 * squash, radius: 0.5 });
}

// ---- mushroom coral (free-living disc) --------------------------------------------------
function mushroom(seed) {
  const rng = new Rng(seed);
  const m = new MeshBuilder();
  const rings = 14, segs = 56;
  const ripple = 0.015 + rng.next() * 0.02, k = 4 + rng.int(4);
  const top = [];
  for (let r = 0; r <= rings; r++) {
    const u = r / rings;
    for (let s = 0; s <= segs; s++) {
      const a = (s / segs) * TAU;
      const rr = u * 0.5 * (1 + 0.05 * Math.sin(a * 3 + seed));
      const y = 0.06 * (1 - u * u) + ripple * u * u * Math.sin(a * k + seed) + 0.01;
      top.push(m.add(Math.cos(a) * rr, y, Math.sin(a) * rr, -Math.cos(a) * u * 0.25, 1, -Math.sin(a) * u * 0.25, 0.3 * u, u, a, 0));
    }
  }
  for (let r = 0; r < rings; r++) {
    for (let s = 0; s < segs; s++) {
      const a = r * (segs + 1) + s;
      m.quad(top[a], top[a + segs + 1], top[a + segs + 2], top[a + 1]);
    }
  }
  // underside
  const c = m.add(0, 0, 0, 0, -1, 0, 0, 1, 0, 1);
  const rimStart = rings * (segs + 1);
  for (let s = 0; s < segs; s++) m.tri(c, top[rimStart + s], top[rimStart + s + 1]);
  return m.finish({ height: 0.08, radius: 0.5 });
}

// ---- plate / tiered montipora -----------------------------------------------------------
function plate(seed) {
  const rng = new Rng(seed);
  const m = new MeshBuilder();
  const tiers = 2 + rng.int(3);
  for (let t = 0; t < tiers; t++) {
    const R = (0.55 - t * 0.1) * (0.8 + rng.next() * 0.3);
    const y0 = t * 0.12 + rng.next() * 0.03;
    const ox = (rng.next() - 0.5) * 0.12, oz = t * 0.05;
    const span = Math.PI * (1.1 + rng.next() * 0.4);
    const a0 = Math.PI / 2 - span / 2;
    const rings = 12, segs = 40, th = 0.022;
    const ph = rng.next() * 10;
    const grid = (sideTop) => {
      const start = m.count;
      for (let r = 0; r <= rings; r++) {
        const u = 0.08 + 0.92 * (r / rings);
        for (let s = 0; s <= segs; s++) {
          const a = a0 + (s / segs) * span;
          const edge = R * (1 + 0.1 * Math.sin(a * 5 + ph) + 0.05 * Math.sin(a * 11 + ph * 2));
          const rr = u * edge;
          const y = y0 + 0.05 * u * u * Math.sin(a * 3 + ph) - 0.04 * u * u + (sideTop ? th : 0) * (1 - u * 0.5);
          m.add(ox + Math.cos(a) * rr, y, oz + Math.sin(a) * rr, 0, sideTop ? 1 : -1, 0, 0, u, a, sideTop ? 1 : 0);
        }
      }
      for (let r = 0; r < rings; r++) {
        for (let s = 0; s < segs; s++) {
          const a = start + r * (segs + 1) + s;
          if (sideTop) m.quad(a, a + segs + 1, a + segs + 2, a + 1);
          else m.quad(a, a + 1, a + segs + 2, a + segs + 1);
        }
      }
      return start;
    };
    const ts = grid(true), bs = grid(false);
    // rim
    const rimT = ts + rings * (segs + 1), rimB = bs + rings * (segs + 1);
    for (let s = 0; s < segs; s++) m.quad(rimT + s, rimT + s + 1, rimB + s + 1, rimB + s);
  }
  return m.finish({ height: 0.35, radius: 0.55 });
}

// ---- gorgonian sea fan ------------------------------------------------------------------
function fan(seed) {
  const rng = new Rng(seed);
  const m = new MeshBuilder();
  const H = 1.0;
  const grow = (p, ang, len, r, depth) => {
    const segs = 3;
    const pts = [];
    let a = ang, q = p.slice();
    for (let k = 0; k <= segs; k++) {
      const sway = Math.min(1, Math.max(0, q[1] / H));
      pts.push({ p: q.slice(), r: r * (1 - 0.25 * k / segs), aux: [sway, depth / 7, q[1] * 3 + q[0] * 2, 0] });
      a += (rng.next() - 0.5) * 0.25;
      q = [q[0] + Math.sin(a) * len / segs, q[1] + Math.cos(a) * len / segs, q[2] + (rng.next() - 0.5) * 0.01];
    }
    m.tube(pts, 5, depth === 0);
    if (depth === 0) return;
    const spread = 0.35 + rng.next() * 0.25;
    grow(q, a - spread * (0.6 + rng.next() * 0.6), len * (0.7 + rng.next() * 0.15), r * 0.75, depth - 1);
    grow(q, a + spread * (0.6 + rng.next() * 0.6), len * (0.7 + rng.next() * 0.15), r * 0.75, depth - 1);
  };
  grow([0, -0.02, 0], (rng.next() - 0.5) * 0.2, 0.22, 0.03, 6);
  return m.finish({ height: H, radius: 0.6 });
}

// ---- toadstool leather coral ------------------------------------------------------------
function leather(seed) {
  const rng = new Rng(seed);
  const m = new MeshBuilder();
  const stalkH = 0.28 + rng.next() * 0.12;
  const capR = 0.26 + rng.next() * 0.08;
  const pts = [];
  for (let k = 0; k <= 8; k++) {
    const u = k / 8;
    pts.push({ p: [Math.sin(u * 2 + seed) * 0.02, u * stalkH, 0], r: 0.085 - 0.02 * u + (k === 0 ? 0.03 : 0), aux: [u * 0.5, 0, 0, 0] });
  }
  m.tube(pts, 18, false);
  const rings = 14, segs = 64, folds = 5 + rng.int(4), ph = rng.next() * 10;
  const surf = (topSide) => {
    const start = m.count;
    for (let r = 0; r <= rings; r++) {
      const u = r / rings;
      for (let s = 0; s <= segs; s++) {
        const a = (s / segs) * TAU;
        const rr = (0.05 + u * capR) * (1 + 0.06 * Math.sin(a * 3 + ph));
        const fold = u * u * 0.06 * Math.sin(a * folds + ph);
        const y = stalkH + 0.06 * (1 - u * u) + fold - u * u * 0.04 + (topSide ? 0.015 : -0.02 * (1 - u));
        m.add(Math.cos(a) * rr, y, Math.sin(a) * rr, 0, topSide ? 1 : -1, 0, 0.5 + 0.5 * u, u, a, topSide ? 1 : 0.5);
      }
    }
    for (let r = 0; r < rings; r++) {
      for (let s = 0; s < segs; s++) {
        const a = start + r * (segs + 1) + s;
        if (topSide) m.quad(a, a + segs + 1, a + segs + 2, a + 1);
        else m.quad(a, a + 1, a + segs + 2, a + segs + 1);
      }
    }
    return start;
  };
  const t = surf(true), b = surf(false);
  const rt = t + rings * (segs + 1), rb = b + rings * (segs + 1);
  for (let s = 0; s < segs; s++) m.quad(rt + s, rt + s + 1, rb + s + 1, rb + s);
  return m.finish({ height: stalkH + 0.1, radius: capR });
}

// ---- bubble coral (Plerogyra) -----------------------------------------------------------
function bubble(seed) {
  const rng = new Rng(seed);
  const m = new MeshBuilder();
  const count = 28 + rng.int(14);
  const placed = [];
  for (let k = 0; k < count * 4 && placed.length < count; k++) {
    const a = rng.next() * TAU, el = Math.acos(1 - rng.next() * 0.95);
    const R = 0.2;
    const c = [Math.sin(el) * Math.cos(a) * R, Math.cos(el) * R * 0.8, Math.sin(el) * Math.sin(a) * R];
    const r = 0.045 + rng.next() * 0.03;
    if (placed.some((p) => Math.hypot(p.c[0] - c[0], p.c[1] - c[1], p.c[2] - c[2]) < (p.r + r) * 0.8)) continue;
    placed.push({ c, r });
  }
  for (const { c, r } of placed) {
    const ph = rng.next() * TAU;
    const rows = 8, segs = 12;
    const start = m.count;
    for (let i = 0; i <= rows; i++) {
      const th = (i / rows) * Math.PI;
      for (let s = 0; s < segs; s++) {
        const a = (s / segs) * TAU;
        const nx = Math.sin(th) * Math.cos(a), ny = Math.cos(th), nz = Math.sin(th) * Math.sin(a);
        m.add(c[0] + nx * r, c[1] + ny * r * 0.9, c[2] + nz * r, nx, ny, nz, 0.15, 1 - i / rows, ph, r);
      }
    }
    for (let i = 0; i < rows; i++) {
      for (let s = 0; s < segs; s++) {
        const a = start + i * segs + s, b = start + i * segs + ((s + 1) % segs);
        m.quad(a, b, b + segs, a + segs);
      }
    }
  }
  return m.finish({ height: 0.3, radius: 0.3 });
}

// ---- bubble-tip anemone -----------------------------------------------------------------
function anemone(seed) {
  const rng = new Rng(seed);
  const m = new MeshBuilder();
  // column and oral disc
  const col = [];
  for (let k = 0; k <= 5; k++) {
    const u = k / 5;
    col.push({ p: [0, -0.04 + u * 0.12, 0], r: 0.11 + 0.05 * u * u, aux: [0, 0, 0, 0] });
  }
  m.tube(col, 24, false);
  const disc = m.add(0, 0.085, 0, 0, 1, 0, 0, 0, 0, 0);
  const rimStart = m.count - 1 - 24;
  for (let s = 0; s < 24; s++) m.tri(disc, rimStart + ((s + 1) % 24), rimStart + s);
  const N = 80 + rng.int(20);
  for (let k = 0; k < N; k++) {
    const u = Math.sqrt((k + 0.5) / N);
    const a = k * 2.39996 + rng.next() * 0.3;
    const rr = 0.02 + u * 0.15;
    const base = [Math.cos(a) * rr, 0.07, Math.sin(a) * rr];
    let d = norm([Math.cos(a) * (0.25 + u * 1.3), 1, Math.sin(a) * (0.25 + u * 1.3)]);
    const len = 0.17 + rng.next() * 0.09 - u * 0.03;
    const ph = rng.next() * TAU;
    const pts = [];
    const segs = 7;
    let q = base.slice();
    for (let s = 0; s <= segs; s++) {
      const v = s / segs;
      // bubble-tip: a swelling just below the tip
      const r = 0.012 * (1 - 0.3 * v) + 0.009 * Math.exp(-Math.pow((v - 0.85) / 0.12, 2));
      pts.push({ p: q.slice(), r, aux: [v * v, v, ph, 1] });
      d = norm([d[0] * 1.02, d[1] - 0.06, d[2] * 1.02]);
      q = [q[0] + d[0] * len / segs, q[1] + d[1] * len / segs, q[2] + d[2] * len / segs];
    }
    m.tube(pts, 6, true);
  }
  return m.finish({ height: 0.35, radius: 0.4 });
}

// ---- rubble -----------------------------------------------------------------------------
function stone(seed) {
  const rng = new Rng(seed);
  const noise = makeNoise(seed);
  const m = new MeshBuilder();
  const rows = 10, segs = 16;
  const sx = 0.7 + rng.next() * 0.6, sy = 0.35 + rng.next() * 0.35, sz = 0.6 + rng.next() * 0.6;
  for (let i = 0; i <= rows; i++) {
    const th = (i / rows) * Math.PI;
    for (let s = 0; s <= segs; s++) {
      const a = (s / segs) * TAU;
      let x = Math.sin(th) * Math.cos(a), y = Math.cos(th), z = Math.sin(th) * Math.sin(a);
      const b = 1 + 0.25 * noise.n3(x * 1.5, y * 1.5, z * 1.5);
      m.add(x * sx * b * 0.5, y * sy * b * 0.5, z * sz * b * 0.5, x / sx, y / sy, z / sz, 0, 0, 0, 0);
    }
  }
  for (let i = 0; i < rows; i++) {
    for (let s = 0; s < segs; s++) {
      const a = i * (segs + 1) + s;
      m.quad(a, a + 1, a + segs + 2, a + segs + 1);
    }
  }
  return m.finish({ height: sy * 0.5, radius: 0.5 });
}

function shell(seed) {
  const rng = new Rng(seed);
  const m = new MeshBuilder();
  // half of a ribbed bivalve, sometimes broken
  const rows = 10, segs = 24;
  const span = Math.PI * (0.65 + rng.next() * 0.35);
  for (let i = 0; i <= rows; i++) {
    const u = i / rows;
    for (let s = 0; s <= segs; s++) {
      const a = -span / 2 + (s / segs) * span;
      const r = u * 0.5;
      const y = 0.18 * Math.sqrt(Math.max(0, 1 - u * u)) * 0.6 + 0.01 * Math.sin(a * 18) * u;
      m.add(Math.sin(a) * r, y, Math.cos(a) * r - 0.2, Math.sin(a) * u * 0.4, 1, Math.cos(a) * u * 0.4, 0, u, a * 18, 0);
    }
  }
  for (let i = 0; i < rows; i++) {
    for (let s = 0; s < segs; s++) {
      const a = i * (segs + 1) + s;
      m.quad(a, a + 1, a + segs + 2, a + segs + 1);
    }
  }
  return m.finish({ height: 0.1, radius: 0.5 });
}

// ---- js/reef.js ----
// Reef construction. Live rock is a density field of stacked, noise-warped boulders with
// carved caves and passages, meshed with naive surface nets. The same field (plus the
// corals) is the obstacle field the fish steer around. Corals are placed on the rock
// surface by type-specific rules, and rubble and shells are scattered over the sand.


const TANK = { width: 14, height: 7.875, depth: 5, surfaceY: 7.875 };
// The simulated swimming volume. It is wider than the screen so fish can swim out of view.
const FISH_BOUNDS = { xMin: -8.8, xMax: 8.8, yMin: 0.15, yMax: 6.9, zMin: -4.75, zMax: -0.4 };
const ISO = 0.25;

// ---- scalar field on a regular grid -------------------------------------------------------
class Field {
  constructor(x0, y0, z0, h, nx, ny, nz) {
    Object.assign(this, { x0, y0, z0, h, nx, ny, nz });
    this.data = new Float32Array(nx * ny * nz);
  }
  idx(i, j, k) { return (k * this.ny + j) * this.nx + i; }
  sample(x, y, z) {
    const fx = (x - this.x0) / this.h, fy = (y - this.y0) / this.h, fz = (z - this.z0) / this.h;
    if (fx < 0 || fy < 0 || fz < 0 || fx >= this.nx - 1 || fy >= this.ny - 1 || fz >= this.nz - 1) return 0;
    const i = fx | 0, j = fy | 0, k = fz | 0;
    const u = fx - i, v = fy - j, w = fz - k;
    const d = this.data, nx = this.nx, sxy = nx * this.ny;
    const o = (k * this.ny + j) * nx + i;
    const c00 = d[o] + (d[o + 1] - d[o]) * u;
    const c10 = d[o + nx] + (d[o + nx + 1] - d[o + nx]) * u;
    const c01 = d[o + sxy] + (d[o + sxy + 1] - d[o + sxy]) * u;
    const c11 = d[o + sxy + nx] + (d[o + sxy + nx + 1] - d[o + sxy + nx]) * u;
    const c0 = c00 + (c10 - c00) * v, c1 = c01 + (c11 - c01) * v;
    return c0 + (c1 - c0) * w;
  }
  gradient(x, y, z, out) {
    const e = this.h;
    out.x = (this.sample(x + e, y, z) - this.sample(x - e, y, z)) / (2 * e);
    out.y = (this.sample(x, y + e, z) - this.sample(x, y - e, z)) / (2 * e);
    out.z = (this.sample(x, y, z + e) - this.sample(x, y, z - e)) / (2 * e);
    return out;
  }
  // Splat an ellipsoid metaball with axes (ax, ay, az) scaled by radii (rx, ry, rz).
  splat(cx, cy, cz, ax, ay, az, rx, ry, rz, weight = 1, warp = null) {
    const R = Math.max(rx, ry, rz) + (warp ? 0.5 : 0);
    const { x0, y0, z0, h, nx, ny, nz } = this;
    const i0 = Math.max(0, Math.floor((cx - R - x0) / h)), i1 = Math.min(nx - 1, Math.ceil((cx + R - x0) / h));
    const j0 = Math.max(0, Math.floor((cy - R - y0) / h)), j1 = Math.min(ny - 1, Math.ceil((cy + R - y0) / h));
    const k0 = Math.max(0, Math.floor((cz - R - z0) / h)), k1 = Math.min(nz - 1, Math.ceil((cz + R - z0) / h));
    const d = this.data;
    for (let k = k0; k <= k1; k++) {
      for (let j = j0; j <= j1; j++) {
        let o = (k * ny + j) * nx + i0;
        for (let i = i0; i <= i1; i++, o++) {
          let px = x0 + i * h - cx, py = y0 + j * h - cy, pz = z0 + k * h - cz;
          if (warp) { px += warp[o * 3]; py += warp[o * 3 + 1]; pz += warp[o * 3 + 2]; }
          const lx = (px * ax[0] + py * ax[1] + pz * ax[2]) / rx;
          const ly = (px * ay[0] + py * ay[1] + pz * ay[2]) / ry;
          const lz = (px * az[0] + py * az[1] + pz * az[2]) / rz;
          const d2 = lx * lx + ly * ly + lz * lz;
          if (d2 < 1) { const q = 1 - d2; d[o] += weight * q * q; }
        }
      }
    }
  }
}

// ---- sand ---------------------------------------------------------------------------------
function makeSand(seed) {
  const noise = makeNoise(seed + 17);
  return (x, z) => 0.05 + 0.09 * noise.n2(x * 0.28, z * 0.28) + 0.035 * noise.n2(x * 0.9 + 4, z * 0.9 - 2)
    + Math.max(0, -z - 2.5) * 0.045 - Math.max(0, z + 0.6) * 0.05;
}

const yawAxes = (yaw) => {
  const c = Math.cos(yaw), s = Math.sin(yaw);
  return [[c, 0, -s], [0, 1, 0], [s, 0, c]];
};

function layoutRock(rng, style) {

    for (let k = 0; k < count; k++) {

      const y = Math.pow(rng.next(), 0.75) * h * fall;

function layoutStyled(rng, style) {

    const baseN = Math.ceil(count * 0.3);
    for (let k = 0; k < baseN; k++) {
      const a = rng.next() * TAU, rr = Math.sqrt(rng.next()) * 0.85;
      const s = smax * (0.9 + rng.next() * 0.4);
      blobs.push({ x: cx + Math.cos(a) * rr * rx, y: 0.05 + rng.next() * 0.25, z: cz + Math.sin(a) * rr * rz,
        rx: s * 1.2, ry: s * 0.6, rz: s * 1.05, yaw: rng.next() * TAU });
    }
    for (let k = 0; k < count; k++) {
      const a = rng.next() * TAU, rr = Math.sqrt(rng.next());
      const fall = 1 - rr * rr * 0.75;
      const y = Math.pow(rng.next(), 0.75) * h * fall;
      const s = lerp(smax, smin, y / h) * (0.7 + rng.next() * 0.5);
      blobs.push({ x: cx + Math.cos(a) * rr * rx, y, z: cz + Math.sin(a) * rr * rz,
        rx: s * (1 + rng.next() * 0.5), ry: s * (0.55 + rng.next() * 0.45) * flat, rz: s * (0.85 + rng.next() * 0.4), yaw: rng.next() * TAU });
    }
  };
  for (const m of style.massifs) massif(...m);
  for (const b of style.blobs) blobs.push(b);
  return { blobs, tunnels: style.tunnels, moray: style.moray };
}

// ---- construction -------------------------------------------------------------------------
function buildReef(seed, formation) {
  const style = formation ? FORMATIONS[formation] : null;
  const t0 = performance.now();
  const rng = new Rng(seed);
  const noise = makeNoise(seed);
  const sandHeight = makeSand(seed);
  const h = 0.1;
  const X0 = -13.5, X1 = 13.5, Y0 = -0.7, Y1 = 5.4, Z0 = -10.8, Z1 = -0.1;
  const nx = Math.round((X1 - X0) / h) + 1, ny = Math.round((Y1 - Y0) / h) + 1, nz = Math.round((Z1 - Z0) / h) + 1;
  const field = new Field(X0, Y0, Z0, h, nx, ny, nz);
  const N = nx * ny * nz;

  // low-frequency domain warp, evaluated on a coarse grid and interpolated
  const cw = 0.25, cnx = Math.ceil((X1 - X0) / cw) + 2, cny = Math.ceil((Y1 - Y0) / cw) + 2, cnz = Math.ceil((Z1 - Z0) / cw) + 2;
  const coarse = new Float32Array(cnx * cny * cnz * 3);
  for (let k = 0; k < cnz; k++) for (let j = 0; j < cny; j++) for (let i = 0; i < cnx; i++) {
    const x = X0 + i * cw, y = Y0 + j * cw, z = Z0 + k * cw;
    const o = ((k * cny + j) * cnx + i) * 3;
    coarse[o] = 0.38 * noise.n3(x * 0.42, y * 0.42, z * 0.42) + 0.14 * noise.n3(x * 1.25 + 7, y * 1.25, z * 1.25);
    coarse[o + 1] = 0.3 * noise.n3(x * 0.42 + 31, y * 0.42, z * 0.42) + 0.12 * noise.n3(x * 1.25 + 3, y * 1.25 + 9, z * 1.25);
    coarse[o + 2] = 0.38 * noise.n3(x * 0.42, y * 0.42 + 57, z * 0.42) + 0.14 * noise.n3(x * 1.25, y * 1.25, z * 1.25 + 5);
  }
  const warp = new Float32Array(N * 3);
  for (let k = 0; k < nz; k++) for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const fx = (i * h) / cw, fy = (j * h) / cw, fz = (k * h) / cw;
    const ci = fx | 0, cj = fy | 0, ck = fz | 0, u = fx - ci, v = fy - cj, w = fz - ck;
    const o = ((k * ny + j) * nx + i) * 3;
    for (let c = 0; c < 3; c++) {
      const at = (a, b, d) => coarse[(((ck + d) * cny + cj + b) * cnx + ci + a) * 3 + c];
      const x00 = at(0, 0, 0) + (at(1, 0, 0) - at(0, 0, 0)) * u, x10 = at(0, 1, 0) + (at(1, 1, 0) - at(0, 1, 0)) * u;
      const x01 = at(0, 0, 1) + (at(1, 0, 1) - at(0, 0, 1)) * u, x11 = at(0, 1, 1) + (at(1, 1, 1) - at(0, 1, 1)) * u;
      const y0 = x00 + (x10 - x00) * v, y1 = x01 + (x11 - x01) * v;
      warp[o + c] = y0 + (y1 - y0) * w;
    }
  }

  const layout = layoutRock(rng, style);
  for (const b of layout.blobs) {
    const [ax, ay, az] = yawAxes(b.yaw);
    field.splat(b.x, b.y, b.z, ax, ay, az, b.rx / 0.7071, b.ry / 0.7071, b.rz / 0.7071, 1, warp);
  }
  // craggy detail near the surface, then carve the caves
  const d = field.data;
  for (let k = 0; k < nz; k++) for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const o = (k * ny + j) * nx + i;
    const f = d[o];
    if (f < 0.04 || f > 0.9) continue;
    const x = X0 + i * h, y = Y0 + j * h, z = Z0 + k * h;
    const r1 = 1 - Math.abs(noise.n3(x * 1.9, y * 1.9, z * 1.9));
    const r2 = noise.n3(x * 4.1 + 11, y * 4.1, z * 4.1);
    d[o] = f + 0.2 * (r1 - 0.55) + 0.07 * r2;
  }
  for (const t of layout.tunnels) {
    const [ax, ay, az] = t.a, bx = t.b[0] - ax, by = t.b[1] - ay, bz = t.b[2] - az;
    const L2 = bx * bx + by * by + bz * bz;
    const R = t.r + 0.4;
    const i0 = Math.max(0, Math.floor((Math.min(ax, t.b[0]) - R - X0) / h)), i1 = Math.min(nx - 1, Math.ceil((Math.max(ax, t.b[0]) + R - X0) / h));
    const j0 = Math.max(0, Math.floor((Math.min(ay, t.b[1]) - R - Y0) / h)), j1 = Math.min(ny - 1, Math.ceil((Math.max(ay, t.b[1]) + R - Y0) / h));
    const k0 = Math.max(0, Math.floor((Math.min(az, t.b[2]) - R - Z0) / h)), k1 = Math.min(nz - 1, Math.ceil((Math.max(az, t.b[2]) + R - Z0) / h));
    for (let k = k0; k <= k1; k++) for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const o = (k * ny + j) * nx + i;
      const px = X0 + i * h + warp[o * 3] * 0.35 - ax, py = Y0 + j * h + warp[o * 3 + 1] * 0.35 - ay, pz = Z0 + k * h + warp[o * 3 + 2] * 0.35 - az;
      const s = clamp((px * bx + py * by + pz * bz) / L2, 0, 1);
      const qx = px - bx * s, qy = py - by * s, qz = pz - bz * s;
      const dd = Math.sqrt(qx * qx + qy * qy + qz * qz) / t.r;
      if (dd < 1.6) d[o] -= 1.6 * Math.max(0, 1 - (dd * dd) / 2.56) ** 2 * (dd < 1 ? 2.5 : 1);
    }
  }
  // nothing above the reef's ceiling or touching the glass
  for (let k = 0; k < nz; k++) for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const z = Z0 + k * h;
    if (z > -0.45 || j === ny - 1) d[(k * ny + j) * nx + i] = Math.min(d[(k * ny + j) * nx + i], 0);
  }
  const tField = performance.now();

  const rock = surfaceNets(field, ISO);
  bakeRockAO(rock, field);
  const tMesh = performance.now();

  // ---- sand ---------------------------------------------------------------------------
  const sand = buildSand(sandHeight, field);

  // ---- corals ---------------------------------------------------------------------------
  const obstacle = new Field(X0, Y0, Z0, h, nx, ny, nz);
  obstacle.data.set(field.data);
  const corals = placeCorals(rng, rock, field, obstacle, sandHeight, style);

  // ---- cave for the moray -------------------------------------------------------------
  const m = layout.moray;
  const dir = [m.outer[0] - m.inner[0], m.outer[1] - m.inner[1], m.outer[2] - m.inner[2]];
  const dl = Math.hypot(...dir);
  const dirOut = dir.map((v) => v / dl);
  let mouth = m.outer.slice();
  for (let s = 0.5; s < dl; s += 0.02) {
    const p = [m.inner[0] + dirOut[0] * s, m.inner[1] + dirOut[1] * s, m.inner[2] + dirOut[2] * s];
    // the mouth is where rock stops surrounding the tunnel
    let solid = 0;
    for (let a = 0; a < 8; a++) {
      const ang = (a / 8) * TAU;
      solid += field.sample(p[0] + Math.cos(ang) * 0.45 * dirOut[2], p[1] + Math.sin(ang) * 0.45, p[2] - Math.cos(ang) * 0.45 * dirOut[0]) > ISO ? 1 : 0;
    }
    if (solid < 4) { mouth = p; break; }
  }

  // ---- points of interest for behavior ------------------------------------------------
  const shelter = [], ledges = [];
  const vp = rock.positions, vn = rock.normals, ao = rock.ao;
  for (let i = 0; i < rock.count; i += 3) {
    const x = vp[i * 3], y = vp[i * 3 + 1], z = vp[i * 3 + 2];
    if (x < FISH_BOUNDS.xMin + 0.5 || x > FISH_BOUNDS.xMax - 0.5 || z < FISH_BOUNDS.zMin + 0.3 || z > FISH_BOUNDS.zMax - 0.3) continue;
    const nX = vn[i * 3], nY = vn[i * 3 + 1], nZ = vn[i * 3 + 2];
    if (nZ < -0.4) continue;
    if (ao[i] > 0.22 && ao[i] < 0.6 && y > 0.4) shelter.push([x + nX * 0.4, y + nY * 0.4, z + nZ * 0.4]);
    if ((nY < -0.25 || ao[i] < 0.45) && y > 0.4 && y < 3.2) ledges.push([x + nX * 0.28, y + nY * 0.28, z + nZ * 0.28]);
  }
  const bubbleSources = [];
  for (let tries = 0; tries < 4000 && bubbleSources.length < 5; tries++) {
    const i = rng.int(rock.count);
    const y = vp[i * 3 + 1], x = vp[i * 3], z = vp[i * 3 + 2];
    if (vn[i * 3 + 1] > 0.75 && y > 1.2 && Math.abs(x) < 6.2 && z > -4.6 && z < -1.2 && ao[i] < 0.8 &&
      bubbleSources.every((b) => Math.hypot(b[0] - x, b[2] - z) > 2.2)) bubbleSources.push([x, y, z]);
  }

  console.log(`reef: field ${(tField - t0).toFixed(0)} ms, mesh ${(tMesh - tField).toFixed(0)} ms (${rock.count} verts), total ${(performance.now() - t0).toFixed(0)} ms`);
  return {
    field, obstacle, sandHeight, rock, sand, corals,
    moray: { mouth, dirOut, inner: m.inner },
    shelter, ledges, bubbleSources,
  };
}

// ---- naive surface nets -----------------------------------------------------------------------
function surfaceNets(field, iso) {
  const { nx, ny, nz, x0, y0, z0, h, data } = field;
  const cnx = nx - 1, cny = ny - 1, cnz = nz - 1;
  const cellV = new Int32Array(cnx * cny * cnz).fill(-1);
  const pos = [];
  const corner = new Float32Array(8);
  const E = [[0, 1], [2, 3], [4, 5], [6, 7], [0, 2], [1, 3], [4, 6], [5, 7], [0, 4], [1, 5], [2, 6], [3, 7]];
  for (let k = 0; k < cnz; k++) {
    for (let j = 0; j < cny; j++) {
      for (let i = 0; i < cnx; i++) {
        let mask = 0;
        for (let c = 0; c < 8; c++) {
          const v = data[((k + (c >> 2)) * ny + j + ((c >> 1) & 1)) * nx + i + (c & 1)];
          corner[c] = v;
          if (v > iso) mask |= 1 << c;
        }
        if (mask === 0 || mask === 255) continue;
        let sx = 0, sy = 0, sz = 0, cnt = 0;
        for (const [a, b] of E) {
          const va = corner[a], vb = corner[b];
          if ((va > iso) === (vb > iso)) continue;
          const t = (iso - va) / (vb - va);
          sx += (a & 1) + ((b & 1) - (a & 1)) * t;
          sy += ((a >> 1) & 1) + (((b >> 1) & 1) - ((a >> 1) & 1)) * t;
          sz += (a >> 2) + ((b >> 2) - (a >> 2)) * t;
          cnt++;
        }
        cellV[(k * cny + j) * cnx + i] = pos.length / 3;
        pos.push(x0 + (i + sx / cnt) * h, y0 + (j + sy / cnt) * h, z0 + (k + sz / cnt) * h);
      }
    }
  }
  const idx = [];
  const cell = (i, j, k) => cellV[(k * cny + j) * cnx + i];
  const emit = (a, b, c, d, flip) => {
    if (a < 0 || b < 0 || c < 0 || d < 0) return;
    if (flip) idx.push(a, d, c, a, c, b); else idx.push(a, b, c, a, c, d);
  };
  for (let k = 1; k < cnz; k++) {
    for (let j = 1; j < cny; j++) {
      for (let i = 1; i < cnx; i++) {
        const v0 = data[(k * ny + j) * nx + i] > iso;
        if (i < cnx && (data[(k * ny + j) * nx + i + 1] > iso) !== v0)
          emit(cell(i, j - 1, k - 1), cell(i, j, k - 1), cell(i, j, k), cell(i, j - 1, k), !v0);
        if ((data[(k * ny + j + 1) * nx + i] > iso) !== v0)
          emit(cell(i - 1, j, k - 1), cell(i - 1, j, k), cell(i, j, k), cell(i, j, k - 1), !v0);
        if ((data[((k + 1) * ny + j) * nx + i] > iso) !== v0)
          emit(cell(i - 1, j - 1, k), cell(i, j - 1, k), cell(i, j, k), cell(i - 1, j, k), !v0);
      }
    }
  }
  const count = pos.length / 3;
  const positions = new Float32Array(pos);
  const normals = new Float32Array(count * 3);
  const g = { x: 0, y: 0, z: 0 };
  for (let v = 0; v < count; v++) {
    field.gradient(positions[v * 3], positions[v * 3 + 1], positions[v * 3 + 2], g);
    const l = Math.hypot(g.x, g.y, g.z) || 1;
    normals[v * 3] = -g.x / l; normals[v * 3 + 1] = -g.y / l; normals[v * 3 + 2] = -g.z / l;
  }
  return { positions, normals, indices: new Uint32Array(idx), count, ao: new Float32Array(count) };
}

function bakeRockAO(rock, field) {
  const dirs = [];
  const n = 14;
  for (let i = 0; i < n; i++) {
    const y = 1 - (2 * (i + 0.5)) / n, r = Math.sqrt(1 - y * y), a = i * 2.39996;
    dirs.push([Math.cos(a) * r, y, Math.sin(a) * r]);
  }
  const dists = [0.18, 0.42, 0.9, 1.7];
  const { positions: p, normals: nn, ao, count } = rock;
  for (let v = 0; v < count; v++) {
    const x = p[v * 3], y = p[v * 3 + 1], z = p[v * 3 + 2];
    const nX = nn[v * 3], nY = nn[v * 3 + 1], nZ = nn[v * 3 + 2];
    let occ = 0, tot = 0;
    for (const dd of dirs) {
      const c = dd[0] * nX + dd[1] * nY + dd[2] * nZ;
      if (c < 0.15) continue;
      for (let q = 0; q < dists.length; q++) {
        const s = dists[q], w = c / (1 + q * 0.6);
        const f = field.sample(x + (dd[0] + nX * 0.3) * s, y + (dd[1] + nY * 0.3) * s, z + (dd[2] + nZ * 0.3) * s);
        occ += w * clamp(f / (ISO * 1.4), 0, 1);
        tot += w;
      }
    }
    // overhead light reaching down into caves and under ledges
    let sky = 0;
    for (const s of [0.4, 0.9, 1.8, 3.2]) sky += clamp(field.sample(x + nX * 0.15, y + s, z + nZ * 0.15) / ISO, 0, 1);
    ao[v] = clamp(1 - 1.5 * (occ / Math.max(1e-6, tot)), 0.04, 1) * (1 - 0.17 * sky);
  }
}

function buildSand(sandHeight, field) {
  const X0 = -18, X1 = 18, Z0 = -13, Z1 = 2.5;
  const cols = 220, rows = 110;
  const verts = new Float32Array((cols + 1) * (rows + 1) * 7);
  const idx = new Uint32Array(cols * rows * 6);
  let o = 0;
  for (let r = 0; r <= rows; r++) {
    for (let c = 0; c <= cols; c++) {
      const x = X0 + ((X1 - X0) * c) / cols, z = Z0 + ((Z1 - Z0) * r) / rows;
      verts[o++] = x; verts[o++] = sandHeight(x, z); verts[o++] = z;
      const e = 0.05;
      const dx = (sandHeight(x + e, z) - sandHeight(x - e, z)) / (2 * e), dz = (sandHeight(x, z + e) - sandHeight(x, z - e)) / (2 * e);
      const nl = Math.hypot(dx, 1, dz);
      verts[o++] = -dx / nl; verts[o++] = 1 / nl; verts[o++] = -dz / nl;
      // occlusion from nearby rock, so sand darkens where it meets the reef
      let occ = 0;
      const y = sandHeight(x, z);
      for (let a = 0; a < 8; a++) {
        const ang = (a / 8) * TAU;
        occ += clamp(field.sample(x + Math.cos(ang) * 0.35, y + 0.12, z + Math.sin(ang) * 0.35) / ISO, 0, 1) * 0.6;
        occ += clamp(field.sample(x + Math.cos(ang) * 0.8, y + 0.4, z + Math.sin(ang) * 0.8) / ISO, 0, 1) * 0.35;
      }
      occ += clamp(field.sample(x, y + 0.8, z) / ISO, 0, 1) * 2 + clamp(field.sample(x, y + 1.6, z) / ISO, 0, 1) * 1.5;
      verts[o++] = clamp(1 - occ / 9, 0.12, 1);
    }
  }
  let k = 0;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const a = r * (cols + 1) + c;
    idx[k++] = a; idx[k++] = a + cols + 1; idx[k++] = a + cols + 2;
    idx[k++] = a; idx[k++] = a + cols + 2; idx[k++] = a + 1;
  }
  return { vertices: verts, indices: idx };
}

// ---- coral placement ------------------------------------------------------------------------
function placeCorals(rng, rock, field, obstacle, sandHeight, style) {
  const variants = {};   // type name -> [mesh, ...]
  const VCOUNT = { staghorn: 4, brain: 3, mushroom: 3, plate: 3, fan: 3, leather: 3, bubble: 2, anemone: 2, finger: 3, stone: 5, shell: 3 };
  for (const [name, n] of Object.entries(VCOUNT)) {
    variants[name] = [];
    for (let v = 0; v < n; v++) variants[name].push(GENERATORS[name](rng.int(1e9)));
  }
  const instances = [];
  const placed = [];
  const { positions: P, normals: Nn, ao: AO, count } = rock;
  const cand = [];
  for (let i = 0; i < count; i++) {
    const x = P[i * 3], y = P[i * 3 + 1], z = P[i * 3 + 2];
    if (x < -10 || x > 10 || z < -5.4 || z > -0.5 || y < sandHeight(x, z) + 0.1) continue;
    cand.push(i);
  }
  const free = (x, y, z, r) => placed.every((q) => Math.hypot(q[0] - x, q[1] - y, q[2] - z) > (q[3] + r) * 0.8);
  const anemones = [];

  function basis(up, fwdHint) {
    const ul = Math.hypot(...up);
    const u = up.map((v) => v / ul);
    let f = fwdHint;
    const dp = f[0] * u[0] + f[1] * u[1] + f[2] * u[2];
    f = [f[0] - u[0] * dp, f[1] - u[1] * dp, f[2] - u[2] * dp];
    const fl = Math.hypot(...f) || 1;
    f = f.map((v) => v / fl);
    const r = [u[1] * f[2] - u[2] * f[1], u[2] * f[0] - u[0] * f[2], u[0] * f[1] - u[1] * f[0]];
    return { r, u, f };
  }
  function add(name, variant, pos, b, scale, opts = {}) {
    const mesh = variants[name][variant];
    const type = CORAL_TYPES[name];
    const pal = rng.pick(PALETTES[name]);
    const jitter = () => 0.9 + rng.next() * 0.2;
    const ca = lin(pal[0]).map((c) => c * jitter()), cb = lin(pal[1]).map((c) => c * jitter());
    const ao = opts.ao ?? 1;
    instances.push({ name, type, variant, pos, b, scale, colorA: ca, colorB: cb, ao, phase: rng.next() * TAU, sway: opts.sway ?? 1 });
    const H = mesh.height * scale, R = mesh.radius * scale;
    placed.push([pos[0] + b.u[0] * H * 0.5, pos[1] + b.u[1] * H * 0.5, pos[2] + b.u[2] * H * 0.5, Math.max(R, H * 0.5)]);
    if (name === 'anemone') { anemones.push({ pos: [pos[0], pos[1] + 0.15 * scale, pos[2]], radius: R }); return; }
    if (name === 'stone' || name === 'shell' || name === 'mushroom') return;
    if (name === 'fan') obstacle.splat(pos[0] + b.u[0] * H * 0.5, pos[1] + b.u[1] * H * 0.5, pos[2] + b.u[2] * H * 0.5, b.r, b.u, b.f, R * 0.95, H * 0.6, 0.18 * scale, 0.9);
    else obstacle.splat(pos[0] + b.u[0] * H * 0.4, pos[1] + b.u[1] * H * 0.4, pos[2] + b.u[2] * H * 0.4, b.r, b.u, b.f, R * 0.95, H * 0.75, R * 0.95, 0.9);
  }
  function scatter(name, n, test, scaleRange, orient, spacing = 1) {
    let made = 0;
    for (let tries = 0; tries < 6000 && made < n; tries++) {
      const i = cand[rng.int(cand.length)];
      const x = P[i * 3], y = P[i * 3 + 1], z = P[i * 3 + 2];
      const nrm = [Nn[i * 3], Nn[i * 3 + 1], Nn[i * 3 + 2]];
      if (!test(x, y, z, nrm, AO[i])) continue;
      const scale = scaleRange[0] + rng.next() * (scaleRange[1] - scaleRange[0]);
      const v = rng.int(variants[name].length);
      const mesh = variants[name][v];
      const R = Math.max(mesh.radius, mesh.height * 0.5) * scale * spacing;
      if (!free(x, y, z, R)) continue;
      const b = orient(nrm);
      add(name, v, [x - nrm[0] * 0.03, y - nrm[1] * 0.03, z - nrm[2] * 0.03], b, scale, { ao: AO[i] });
      made++;
    }
  }
  const upish = (k) => (n) => basis([n[0] * k, n[1] * k + (1 - k), n[2] * k], [Math.cos(rng.next() * TAU), 0, Math.sin(rng.next() * TAU)]);
  const n = {
    staghorn: 18, fan: 9, brain: 12, leather: 9, plate: 13, finger: 15, bubble: 8,
    staghorn2: 10, finger2: 10, brain2: 8, mushrooms: 10, sandBrain: 2, stones: 170, shells: 70,
  };
  if (style && style.coral) Object.assign(n, style.coral);
  const anemoneSpots = style && style.anemones
    ? style.anemones
    : [[-2.55, -1.6, 1.25], [5.3, -1.9, 1.0], [-6.6, -1.6, 0.95]];

  // anemones first: the clownfish host sits on the anemone rock in clear view
  const topAt = (tx, tz, rad) => {
    let best = -1, by = -1e9;
    for (const i of cand) {
      const x = P[i * 3], z = P[i * 3 + 2];
      if (Math.hypot(x - tx, z - tz) > rad || Nn[i * 3 + 1] < 0.6) continue;
      if (P[i * 3 + 1] > by) { by = P[i * 3 + 1]; best = i; }
    }
    return best;
  };
  for (const [tx, tz, s] of anemoneSpots) {
    const i = topAt(tx, tz, 0.6);
    if (i < 0) continue;
    const nrm = [Nn[i * 3], Nn[i * 3 + 1], Nn[i * 3 + 2]];
    add('anemone', rng.int(2), [P[i * 3], P[i * 3 + 1] - 0.03, P[i * 3 + 2]], upish(0.35)(nrm), s, { ao: AO[i] });
  }
  scatter('staghorn', n.staghorn, (x, y, z, nrm, ao) => nrm[1] > 0.7 && ao > 0.48 && y > 0.9, [1.0, 1.6], upish(0.3));
  scatter('fan', n.fan, (x, y, z, nrm, ao) => nrm[1] > 0.55 && z < -2.2 && y > 1.2 && ao > 0.5, [1.0, 1.7],
    (nrm) => basis([nrm[0] * 0.15, 1, nrm[2] * 0.15], [Math.sin((rng.next() - 0.5) * 1.0), 0, Math.cos((rng.next() - 0.5) * 1.0)]), 0.8);
  scatter('brain', n.brain, (x, y, z, nrm, ao) => nrm[1] > 0.7 && ao > 0.45, [0.6, 1.1], upish(0.5));
  scatter('leather', n.leather, (x, y, z, nrm, ao) => nrm[1] > 0.72 && ao > 0.48, [1.0, 1.6], upish(0.3));
  scatter('plate', n.plate, (x, y, z, nrm, ao) => nrm[1] > -0.15 && nrm[1] < 0.5 && nrm[2] > 0.2 && ao > 0.35 && y > 0.6, [0.7, 1.2],
    (nrm) => basis([0, 1, 0], [nrm[0], 0, nrm[2]]));
  scatter('finger', n.finger, (x, y, z, nrm, ao) => nrm[1] > 0.62 && ao > 0.42, [0.95, 1.5], upish(0.4));
  scatter('bubble', n.bubble, (x, y, z, nrm, ao) => nrm[1] > 0.3 && ao > 0.3 && ao < 0.8, [0.95, 1.4], upish(0.6));
  // second, smaller generation filling the gaps
  scatter('staghorn', n.staghorn2, (x, y, z, nrm, ao) => nrm[1] > 0.6 && ao > 0.4, [0.6, 0.9], upish(0.4), 0.7);
  scatter('finger', n.finger2, (x, y, z, nrm, ao) => nrm[1] > 0.5 && ao > 0.4, [0.6, 0.9], upish(0.5), 0.7);
  scatter('brain', n.brain2, (x, y, z, nrm, ao) => nrm[1] > 0.55 && ao > 0.4, [0.35, 0.55], upish(0.6), 0.8);
  // mushroom clusters on low ledges
  for (let c = 0; c < n.mushrooms; c++) {
    for (let tries = 0; tries < 500; tries++) {
      const i = cand[rng.int(cand.length)];
      const y = P[i * 3 + 1];
      if (Nn[i * 3 + 1] < 0.6 || y > 2.6 || AO[i] < 0.4) continue;
      const cx = P[i * 3], cz = P[i * 3 + 2];
      let made = 0;
      for (let k = 0; k < 40 && made < 6; k++) {
        const j = cand[rng.int(cand.length)];
        if (Math.hypot(P[j * 3] - cx, P[j * 3 + 2] - cz) > 0.5 || Nn[j * 3 + 1] < 0.5) continue;
        const nrm = [Nn[j * 3], Nn[j * 3 + 1], Nn[j * 3 + 2]];
        const s = 0.14 + rng.next() * 0.1;
        if (!free(P[j * 3], P[j * 3 + 1], P[j * 3 + 2], s * 0.4)) continue;
        add('mushroom', rng.int(3), [P[j * 3], P[j * 3 + 1] - 0.01, P[j * 3 + 2]], upish(0.8)(nrm), s, { ao: AO[j] });
        made++;
      }
      break;
    }
  }
  // brain corals and rubble on the sand
  const onSand = (name, n, sr, nearRock) => {
    let made = 0;
    for (let tries = 0; tries < n * 30 && made < n; tries++) {
      const x = (rng.next() - 0.5) * 22, z = -0.5 - rng.next() * 6.5;
      const y = sandHeight(x, z);
      const f = field.sample(x, y + 0.08, z);
      if (f > ISO * 0.6) continue;
      if (nearRock && field.sample(x, y + 0.3, z) + field.sample(x + 0.6, y + 0.3, z) + field.sample(x - 0.6, y + 0.3, z) + field.sample(x, y + 0.3, z + 0.6) + field.sample(x, y + 0.3, z - 0.6) < 0.05 && rng.next() < 0.6) continue;
      const s = sr[0] + rng.next() * (sr[1] - sr[0]);
      const v = rng.int(variants[name].length);
      const yaw = rng.next() * TAU;
      const tilt = name === 'shell' ? 0.5 : 0.15;
      const b = basis([(rng.next() - 0.5) * tilt, 1, (rng.next() - 0.5) * tilt], [Math.cos(yaw), 0, Math.sin(yaw)]);
      if (name === 'brain' && !free(x, y, z, s * 0.5)) continue;
      add(name, v, [x, y - variants[name][v].height * s * (name === 'stone' ? 0.45 : 0.1), z], b, s, { ao: clamp(1 - f * 2, 0.3, 1) });
      made++;
    }
  };
  onSand('brain', n.sandBrain, [0.5, 0.75], true);
  onSand('stone', n.stones, [0.06, 0.24], true);
  onSand('shell', n.shells, [0.05, 0.1], false);

  return { variants, instances, anemones };
}

// ---- js/behavior.js ----
// Autonomous fish behavior. Each fish is an independent FishEntity driven by a
// probabilistic finite-state machine and weighted steering:
//   steering = seekTarget + obstacleAvoidance + fishSeparation + territoryPreference
//            + currentInfluence + wandering (+ alignment + cohesion for schools)
// Heading turns toward the steering intent at a limited angular rate, so a fish never
// flips direction in a frame; it slows, banks and bends through the turn instead.
// A goal is kept only when open water lies straight to it, so a fish is not sent
// through rock or coral. One that stalls against the reef turns toward open water
// and picks again. Neighbour queries use a spatial hash rebuilt every step. All
// vectors are preallocated.



const STATE_SPEED = {
  CRUISING: 1.0, EXPLORING: 1.2, HOVERING: 0.12, TURNING: 0.55, AVOIDING: 0.85, SCHOOLING: 1.0, SEEKING_SHELTER: 0.9, RESTING: 0.22,
};
const UP = new V3(0, 1, 0);
const OPEN_STEPS = [1.6, 1.0, 0.5];

class FishEntity {
  constructor(id, key, rng) {
    const def = SPECIES[key];
    const b = def.behavior;
    this.id = id;
    this.species = key;
    this.def = def;
    this.position = new V3();
    this.velocity = new V3();
    this.acceleration = new V3();
    this.heading = new V3(rng.sign(), 0, (rng.next() - 0.5) * 0.6).normalize();
    this.targetPosition = new V3();
    const indiv = 0.85 + rng.next() * 0.3;
    this.bodyLength = def.size[0] + rng.next() * (def.size[1] - def.size[0]);
    this.preferredDepth = lerp(b.zone[0], b.zone[1], 0.25 + rng.next() * 0.5);
    this.preferredSpeed = b.speed * indiv;
    this.maximumSpeed = b.maxSpeed * (0.9 + rng.next() * 0.2);
    this.turnRate = b.turnRate * (0.8 + rng.next() * 0.4);
    this.personalSpace = this.bodyLength * (0.9 + rng.next() * 0.4);
    this.behaviorState = 'CRUISING';
    this.animationPhase = rng.next() * TAU;
    this.tailFrequency = def.anim.tailFreq * (0.88 + rng.next() * 0.24);
    this.finAmplitude = def.anim.pecAmp * (0.85 + rng.next() * 0.3);
    this.homeTerritory = undefined;
    this.schoolId = undefined;
    this.lastBehaviorChange = 0;
    // internal state
    this.speed = this.preferredSpeed * 0.5;
    this.up = new V3(0, 1, 0);
    this.roll = 0;
    this.bend = 0;
    this.yawRate = 0;
    this.pecPhase = rng.next() * TAU;
    this.dorsalPhase = rng.next() * TAU;
    this.tailAmp = 0;
    this.pecAmp = 0;
    this.stateUntil = 0;
    this.prevState = 'CRUISING';
    this.durationScale = 0.75 + rng.next() * 0.5;
    this.aggression = 0.7 + rng.next() * 0.6; // how sharply it commits to direction changes
    this.territoryScale = 0.8 + rng.next() * 0.5;
    this.wanderSeed = [rng.next() * 100, rng.next() * 100, rng.next() * 100];
    this.wanderFreq = [0.07 + rng.next() * 0.08, 0.05 + rng.next() * 0.06, 0.06 + rng.next() * 0.08];
    this.variant = rng.next();
    this.envLight = 1;
    this.stuck = 0;
    this.bestDist = 1e9;
    this.anchor = new V3();
    this.radius = this.bodyLength * 0.2;
    this.clearance = this.bodyLength * (def.id === 7 ? 0.32 : 0.18) + 0.03;
    this.gape = 0;
    this.extension = 0;
    this.headYaw = 0;
  }
}

class Aquarium {
  constructor(reef, cfg, seed, visible) {
    this.reef = reef;
    this.cfg = cfg;
    this.rng = new Rng(seed);
    this.visible = visible;
    this.fish = [];
    this.schools = new Map();
    this.time = 0;
    this.current = new V3();
    // spatial hash over the swimming volume
    this.cell = 1.0;
    this.gx = Math.ceil((FISH_BOUNDS.xMax - FISH_BOUNDS.xMin) / this.cell) + 2;
    this.gy = Math.ceil((FISH_BOUNDS.yMax + 1) / this.cell) + 2;
    this.gz = Math.ceil((FISH_BOUNDS.zMax - FISH_BOUNDS.zMin) / this.cell) + 2;
    this.cellStart = new Int32Array(this.gx * this.gy * this.gz + 1);
    this.cellOf = new Int32Array(256);
    this.sorted = new Int32Array(256);
    // scratch vectors
    this.t = Array.from({ length: 12 }, () => new V3());
    this.g = { x: 0, y: 0, z: 0 };
    this.dir = { x: 0, y: 0, z: 0 };
  }

  spawn(distribution) {
    const rng = this.rng;
    let id = 0;
    for (const [key, n] of Object.entries(distribution)) {
      if (!SPECIES[key]) continue;
      let school = null;
      if (SPECIES[key].behavior.school) {
        school = { id: key + '-school', members: [], target: new V3(), until: 0, center: new V3() };
        this.schools.set(school.id, school);
      }
      for (let k = 0; k < n; k++) {
        const f = new FishEntity(`${key}-${k}`, key, rng);
        f.index = id++;
        if (school) { f.schoolId = school.id; school.members.push(f); }
        this.assignHome(f, k);
        this.placeInitially(f, school, k);
        this.fish.push(f);
      }
      if (school) this.pickSchoolTarget(school);
    }
    if (this.fish.length > this.cellOf.length) {
      this.cellOf = new Int32Array(this.fish.length);
      this.sorted = new Int32Array(this.fish.length);
    }
    for (const f of this.fish) this.chooseState(f, true);
  }

  assignHome(f, k) {
    const b = f.def.behavior, reef = this.reef;
    if (b.territory === 'anemone' && reef.corals.anemones.length) {
      const a = reef.corals.anemones[0];
      f.homeTerritory = new V3(a.pos[0], a.pos[1] + 0.12, a.pos[2]);
    } else if (b.territory === 'ledge' && reef.ledges.length) {
      // spread the grammas over different ledges in view
      for (let tries = 0; tries < 200; tries++) {
        const p = reef.ledges[this.rng.int(reef.ledges.length)];
        if (!this.visible(p[0], p[1], p[2], 0.85) && tries < 150) continue;
        if (this.fish.some((o) => o.homeTerritory && o.species === f.species && o.homeTerritory.distTo({ x: p[0], y: p[1], z: p[2] }) < 1.8) && tries < 180) continue;
        f.homeTerritory = new V3(p[0], p[1], p[2]);
        break;
      }
    } else if (b.territory === 'reef') {
      const p = reef.shelter.length ? reef.shelter[this.rng.int(reef.shelter.length)] : [0, 2, -2];
      f.homeTerritory = new V3(clamp(p[0], -4, 4), clamp(p[1] + 0.6, 1.2, 3.2), clamp(p[2] + 0.3, -3.8, -1.2));
    } else if (b.territory === 'cave') {
      f.homeTerritory = new V3(...reef.moray.mouth);
    }
    if (f.homeTerritory && (b.territory === 'ledge' || b.territory === 'reef')) this.clearPoint(f, f.homeTerritory);
    void k;
  }

  placeInitially(f, school, k) {
    if (f.species === 'morayEel') {
      f.position.set(...this.reef.moray.mouth);
      f.heading.set(...this.reef.moray.dirOut);
      f.anchor.copy(f.position);
      return;
    }
    const p = this.t[0];
    for (let tries = 0; tries < 400; tries++) {
      if (f.homeTerritory && tries < 300) {
        const r = (f.def.behavior.territoryRadius || 1) * f.territoryScale;
        p.set(f.homeTerritory.x + (this.rng.next() - 0.5) * r * 1.6, f.homeTerritory.y + (this.rng.next() - 0.2) * r, f.homeTerritory.z + (this.rng.next() - 0.5) * r);
      } else if (school && school.members.length > 1 && tries < 300) {
        const lead = school.members[0].position;
        p.set(lead.x + (this.rng.next() - 0.5) * 1.6, lead.y + (this.rng.next() - 0.5) * 0.8, lead.z + (this.rng.next() - 0.5) * 1.2);
      } else {
        this.randomPointInZone(f, p, 0, 99, 0.9, false);
      }
      if (!this.isFree(p, f.clearance + 0.1)) continue;
      if (this.fish.some((o) => o.position.distTo(p) < (o.radius + f.radius) * 2.2)) continue;
      break;
    }
    f.position.copy(p);
    f.targetPosition.copy(p);
    f.anchor.copy(p);
    void k;
  }

  isFree(p, clearance) {
    const B = FISH_BOUNDS;
    if (p.x < B.xMin || p.x > B.xMax || p.z < B.zMin || p.z > B.zMax || p.y > B.yMax) return false;
    if (p.y < this.reef.sandHeight(p.x, p.z) + clearance + 0.1) return false;
    const o = this.reef.obstacle;
    if (o.sample(p.x, p.y, p.z) > ISO * 0.35) return false;
    const c = clearance;
    if (o.sample(p.x + c, p.y, p.z) > ISO * 0.6 || o.sample(p.x - c, p.y, p.z) > ISO * 0.6) return false;
    if (o.sample(p.x, p.y + c, p.z) > ISO * 0.6 || o.sample(p.x, p.y - c, p.z) > ISO * 0.6) return false;
    if (o.sample(p.x, p.y, p.z + c) > ISO * 0.6 || o.sample(p.x, p.y, p.z - c) > ISO * 0.6) return false;
    return true;
  }

  // Random free point in the species' preferred band, at a distance between dMin and dMax
  // from the fish, usually somewhere on screen. `sight` rejects points hidden behind rock.
  randomPointInZone(f, out, dMin, dMax, visibleBias = 0.8, sight = true) {
    const b = f.def.behavior, B = FISH_BOUNDS, rng = this.rng;
    const wantVisible = rng.next() < visibleBias;
    // most new goals lie roughly ahead; fish rarely reverse course for no reason
    const ahead = rng.next() < 0.75;
    for (let tries = 0; tries < 80; tries++) {
      out.set(lerp(B.xMin + 0.5, B.xMax - 0.5, rng.next()),
        lerp(b.zone[0], b.zone[1], Math.pow(rng.next(), 0.9)),
        lerp(B.zMin + 0.3, B.zMax - 0.15, rng.next()));
      // bias heights toward the fish's own preferred depth
      out.y = lerp(out.y, f.preferredDepth, 0.3);
      const d = out.distTo(f.position);
      if (tries < 45 && (d < dMin || d > dMax)) continue;
      if (ahead && tries < 30 && d > 1e-3 &&
        ((out.x - f.position.x) * f.heading.x + (out.y - f.position.y) * f.heading.y + (out.z - f.position.z) * f.heading.z) / d < -0.1) continue;
      if (wantVisible && tries < 40 && !this.visible(out.x, out.y, out.z, 0.82)) continue;
      if (!this.isFree(out, f.clearance + 0.15)) continue;
      if (sight && !this.clearLine(f, f.position, out)) continue;
      return out;
    }
    // Spawn runs before the fish has a real position, so it keeps the old fallback.
    return sight ? this.openGoal(f, out) : out.copy(f.position);
  }

  // Straight path stays in open water. Endpoints are skipped: the fish may be sliding
  // on rock, and the goal itself is checked by the caller.
  clearLine(f, from, to) {
    const dx = to.x - from.x, dy = to.y - from.y, dz = to.z - from.z;
    const len = Math.hypot(dx, dy, dz);
    if (len < 0.25) return true;
    const o = this.reef.obstacle, B = FISH_BOUNDS;
    const n = Math.ceil(len / 0.15);
    const limit = ISO * 0.72;
    const clearance = f.clearance;
    const anemones = f.def.behavior.territory === 'anemone' ? null : this.reef.corals.anemones;
    for (let i = 1; i < n; i++) {
      const t = i / n;
      const x = from.x + dx * t, y = from.y + dy * t, z = from.z + dz * t;
      if (x < B.xMin || x > B.xMax || z < B.zMin || z > B.zMax || y > B.yMax) return false;
      if (y < this.reef.sandHeight(x, z) + clearance) return false;
      if (o.sample(x, y, z) > limit) return false;
      if (!anemones) continue;
      for (let a = 0; a < anemones.length; a++) {
        const an = anemones[a];
        const R = an.radius + clearance;
        const qx = x - an.pos[0], qy = y - an.pos[1], qz = z - an.pos[2];
        if (qx * qx + qy * qy + qz * qz < R * R) return false;
      }
    }
    return true;
  }

  // Touching rock, coral, sand, or (for anyone but the resident clownfish) an anemone.
  againstRock(f) {
    const o = this.reef.obstacle, p = f.position, h = f.heading;
    const limit = ISO * 0.8;
    const ax = -h.z, az = h.x;
    const side = Math.max(0.25, f.clearance + 0.15);
    const reach = 0.5 + f.bodyLength * 0.8;
    if (o.sample(p.x, p.y, p.z) > limit) return true;
    if (o.sample(p.x + h.x * 0.4, p.y + h.y * 0.4, p.z + h.z * 0.4) > limit) return true;
    if (o.sample(p.x + h.x * reach, p.y + h.y * reach * 0.3, p.z + h.z * reach) > limit) return true;
    if (o.sample(p.x + ax * side, p.y, p.z + az * side) > limit) return true;
    if (o.sample(p.x - ax * side, p.y, p.z - az * side) > limit) return true;
    if (p.y < this.reef.sandHeight(p.x, p.z) + f.clearance + 0.12) return true;
    if (f.def.behavior.territory !== 'anemone') {
      for (const a of this.reef.corals.anemones) {
        const R = a.radius + 0.2 + f.clearance;
        if (Math.hypot(p.x - a.pos[0], p.y - a.pos[1], p.z - a.pos[2]) < R) return true;
      }
    }
    return false;
  }

  // Least-solid direction around the fish. The fan is rotated so a second try differs.
  openDir(f) {
    const o = this.reef.obstacle, p = f.position, B = FISH_BOUNDS, dir = this.dir;
    let best = Infinity;
    const base = this.rng.next() * TAU;
    for (let i = 0; i < 10; i++) {
      const a = base + (i / 10) * TAU;
      const dx = Math.cos(a), dz = Math.sin(a);
      let score = 0;
      for (let s = 1; s <= 3; s++) {
        const x = p.x + dx * s * 0.55, z = p.z + dz * s * 0.55, y = p.y;
        if (x < B.xMin + 0.4 || x > B.xMax - 0.4 || z < B.zMin + 0.3 || z > B.zMax - 0.2) { score += 2; continue; }
        if (y < this.reef.sandHeight(x, z) + f.clearance + 0.15) score += 1.2;
        score += o.sample(x, y, z) + o.sample(x, y + 0.35, z);
      }
      if (score < best) { best = score; dir.x = dx; dir.y = 0; dir.z = dz; }
    }
    let up = 0;
    for (let s = 1; s <= 3; s++) {
      const y = p.y + s * 0.45;
      if (y > B.yMax - 0.3) { up += 2; break; }
      up += o.sample(p.x, y, p.z);
    }
    if (up + 0.15 < best) dir.y = 0.65;
    const len = Math.hypot(dir.x, dir.y, dir.z) || 1;
    dir.x /= len; dir.y /= len; dir.z /= len;
    return dir;
  }

  // A short goal along the open direction, used when nothing reachable is in sight.
  openGoal(f, out) {
    const dir = this.openDir(f);
    for (let i = 0; i < OPEN_STEPS.length; i++) {
      const dist = OPEN_STEPS[i];
      out.set(f.position.x + dir.x * dist, f.position.y + dir.y * dist, f.position.z + dir.z * dist);
      this.clearPoint(f, out);
      if (this.isFree(out, f.clearance * 0.6) && this.clearLine(f, f.position, out)) return out;
    }
    return out.set(f.position.x + dir.x * 0.45, f.position.y + dir.y * 0.45, f.position.z + dir.z * 0.45);
  }

  // Leave a stall: face open water, drop a turn aimed into the reef, and pick again.
  unstick(f) {
    const dir = this.openDir(f);
    f.heading.set(dir.x, dir.y, dir.z).normalize();
    if (f.behaviorState === 'TURNING' || f.behaviorState === 'AVOIDING' || f.behaviorState === 'HOVERING' || f.behaviorState === 'RESTING') {
      const back = f.prevState;
      const leave = f.behaviorState === 'HOVERING' || f.behaviorState === 'RESTING' || back === 'TURNING' || back === 'AVOIDING';
      this.setState(f, leave ? 'CRUISING' : back);
      f.stateUntil = this.time + 3 + this.rng.next() * 3;
    } else {
      f.stuck = 0;
      f.bestDist = 1e9;
    }
    this.chooseTarget(f);
    const kick = f.preferredSpeed * 0.45 * this.cfg.fish.speedMultiplier;
    if (f.speed < kick) f.speed = kick;
    f.velocity.copy(f.heading).scale(f.speed);
    f.anchor.copy(f.position);
  }

  // Move a goal out of the avoidance margin around rock, so seeking it and steering
  // clear of the reef do not fight each other.
  clearPoint(f, out) {
    const o = this.reef.obstacle, g = this.g;
    for (let k = 0; k < 12; k++) {
      const val = o.sample(out.x, out.y, out.z);
      o.gradient(out.x, out.y, out.z, g);
      const gl = Math.hypot(g.x, g.y, g.z);
      if (gl < 1e-4 || val <= ISO - gl * (f.clearance + 0.3)) break;
      out.x -= (g.x / gl) * 0.05; out.y -= (g.y / gl) * 0.05; out.z -= (g.z / gl) * 0.05;
    }
    return out;
  }

  pickNear(list, f, out, maxD = 4, offsetY = 0) {
    if (!list.length) return this.randomPointInZone(f, out, 0, maxD);
    for (let tries = 0; tries < 40; tries++) {
      const p = list[this.rng.int(list.length)];
      out.set(p[0], p[1] + offsetY, p[2]);
      if (out.distTo(f.position) > maxD && tries < 30) continue;
      if (!this.visible(out.x, out.y, out.z, 0.9) && tries < 20) continue;
      this.clearPoint(f, out);
      if (!this.isFree(out, f.clearance * 0.7)) continue;
      if (!this.clearLine(f, f.position, out)) continue;
      return out;
    }
    return this.randomPointInZone(f, out, 0, maxD);
  }

  pickSchoolTarget(s) {
    const lead = s.members[0];
    if (!lead) return;
    const c = s.center;
    this.randomPointInZone(lead, s.target, 2.5, 9, 0.85);
    s.until = this.time + 7 + this.rng.next() * 9;
    void c;
  }

  // ---- state machine ------------------------------------------------------------------------
  setState(f, state) {
    if (f.behaviorState !== 'TURNING' && f.behaviorState !== 'AVOIDING') f.prevState = f.behaviorState;
    f.behaviorState = state;
    f.lastBehaviorChange = this.time;
    f.stuck = 0;
    f.bestDist = 1e9;
  }

  chooseState(f, initial = false) {
    const b = f.def.behavior;
    const weights = { ...b.states };
    if (!this.cfg.fish.schoolingEnabled) delete weights.SCHOOLING;
    // persistence: a fish slightly prefers to keep doing what it was doing
    if (!initial && weights[f.behaviorState]) weights[f.behaviorState] *= 1.25;
    const next = this.rng.weighted(weights);
    this.setState(f, next);
    const [d0, d1] = b.durations;
    f.stateUntil = this.time + lerp(d0, d1, this.rng.next()) * f.durationScale;
    this.chooseTarget(f);
  }

  chooseTarget(f) {
    const reef = this.reef, out = f.targetPosition, b = f.def.behavior;
    switch (f.behaviorState) {
      case 'CRUISING':
        if (f.homeTerritory) this.nearHome(f, out, 1.0);
        else this.randomPointInZone(f, out, 1.5, 5.5);
        break;
      case 'EXPLORING':
        if (f.homeTerritory && b.territory !== 'reef') this.nearHome(f, out, 1.5);
        else this.randomPointInZone(f, out, 4, 99, 0.7);
        break;
      case 'HOVERING':
        out.copy(f.position).addScaled(f.heading, 0.15);
        if (f.homeTerritory && f.position.distTo(f.homeTerritory) > (b.territoryRadius || 1) * 1.5) this.nearHome(f, out, 0.6);
        else if (!this.isFree(out, f.clearance * 0.5)) this.openGoal(f, out);
        break;
      case 'RESTING': {
        if (f.homeTerritory) { this.nearHome(f, out, 0.4); break; }
        const inst = reef.corals.instances;
        let found = false;
        for (let tries = 0; tries < 30; tries++) {
          const c = inst[this.rng.int(inst.length)];
          if (c.name === 'stone' || c.name === 'shell' || c.name === 'anemone') continue;
          const H = reef.corals.variants[c.name][c.variant].height * c.scale;
          out.set(c.pos[0] + c.b.u[0] * (H + 0.25), c.pos[1] + c.b.u[1] * (H + 0.25) + 0.1, c.pos[2] + c.b.u[2] * (H + 0.25) + 0.15);
          if (out.distTo(f.position) < 5 && this.isFree(out, f.clearance) && this.clearLine(f, f.position, out) && (tries > 20 || this.visible(out.x, out.y, out.z, 0.9))) {
            found = true;
            break;
          }
        }
        if (!found) this.openGoal(f, out);
        break;
      }
      case 'SEEKING_SHELTER':
        if (b.territory === 'anemone' && f.homeTerritory) {
          out.copy(f.homeTerritory); out.y += 0.02;
          if (!this.clearLine(f, f.position, out)) this.nearHome(f, out, 0.8);
        } else if (b.territory === 'ledge') this.pickNear(reef.ledges, f, out, 1.5);
        else this.pickNear(reef.shelter, f, out, 4);
        break;
      case 'SCHOOLING': {
        const s = this.schools.get(f.schoolId);
        if (s) out.copy(s.target); else this.randomPointInZone(f, out, 2, 6);
        if (!this.clearLine(f, f.position, out)) this.randomPointInZone(f, out, 1.2, 4, 0.4);
        break;
      }
      default:
        this.randomPointInZone(f, out, 1.5, 5);
    }
  }

  nearHome(f, out, k) {
    const r = (f.def.behavior.territoryRadius || 1) * f.territoryScale * k;
    const h = f.homeTerritory;
    for (let tries = 0; tries < 30; tries++) {
      out.set(h.x + (this.rng.next() - 0.5) * 2 * r, h.y + (this.rng.next() - 0.35) * r, h.z + (this.rng.next() - 0.5) * 2 * r * 0.7);
      if (f.def.behavior.territory !== 'anemone') this.clearPoint(f, out);
      if (this.isFree(out, f.clearance * 0.8) && this.clearLine(f, f.position, out)) return out;
    }
    if (this.isFree(h, f.clearance * 0.5) && this.clearLine(f, f.position, h)) return out.copy(h);
    return this.openGoal(f, out);
  }

  // ---- spatial hash ---------------------------------------------------------------------------
  rebuildHash() {
    const B = FISH_BOUNDS, c = this.cell, gx = this.gx, gy = this.gy, gz = this.gz;
    const start = this.cellStart;
    start.fill(0);
    const n = this.fish.length;
    for (let i = 0; i < n; i++) {
      const p = this.fish[i].position;
      const ix = clamp(Math.floor((p.x - B.xMin) / c) + 1, 0, gx - 1);
      const iy = clamp(Math.floor(p.y / c) + 1, 0, gy - 1);
      const iz = clamp(Math.floor((p.z - B.zMin) / c) + 1, 0, gz - 1);
      const cell = (iz * gy + iy) * gx + ix;
      this.cellOf[i] = cell;
      start[cell + 1]++;
    }
    for (let i = 1; i < start.length; i++) start[i] += start[i - 1];
    const fill = this._fill || (this._fill = new Int32Array(start.length));
    fill.set(start);
    for (let i = 0; i < n; i++) this.sorted[fill[this.cellOf[i]]++] = i;
  }

  forNeighbors(f, radius, cb) {
    const B = FISH_BOUNDS, c = this.cell, gx = this.gx, gy = this.gy, gz = this.gz, p = f.position;
    const r = Math.ceil(radius / c);
    const ix = clamp(Math.floor((p.x - B.xMin) / c) + 1, 0, gx - 1);
    const iy = clamp(Math.floor(p.y / c) + 1, 0, gy - 1);
    const iz = clamp(Math.floor((p.z - B.zMin) / c) + 1, 0, gz - 1);
    const r2 = radius * radius;
    for (let z = Math.max(0, iz - r); z <= Math.min(gz - 1, iz + r); z++) {
      for (let y = Math.max(0, iy - r); y <= Math.min(gy - 1, iy + r); y++) {
        for (let x = Math.max(0, ix - r); x <= Math.min(gx - 1, ix + r); x++) {
          const cell = (z * gy + y) * gx + x;
          for (let s = this.cellStart[cell]; s < this.cellStart[cell + 1]; s++) {
            const o = this.fish[this.sorted[s]];
            if (o === f) continue;
            const d2 = o.position.distSq(p);
            if (d2 < r2) cb(o, d2);
          }
        }
      }
    }
  }

  // ---- simulation step ------------------------------------------------------------------------
  update(dt, time, current) {
    this.time = time;
    this.current.copy(current);
    this.rebuildHash();
    for (const s of this.schools.values()) {
      s.center.set(0, 0, 0);
      let n = 0;
      for (const m of s.members) if (m.behaviorState === 'SCHOOLING') { s.center.add(m.position); n++; }
      if (n) s.center.scale(1 / n);
      if (time > s.until || (n && s.center.distTo(s.target) < 1.0)) {
        this.pickSchoolTarget(s);
        for (const m of s.members) if (m.behaviorState === 'SCHOOLING') {
          m.targetPosition.copy(s.target);
          if (!this.clearLine(m, m.position, m.targetPosition)) this.randomPointInZone(m, m.targetPosition, 1.2, 4, 0.4);
        }
      }
    }
    for (const f of this.fish) {
      if (f.species === 'morayEel') this.updateMoray(f, dt);
      else this.steer(f, dt);
    }
    this.resolveOverlaps();
    for (const f of this.fish) this.animate(f, dt);
  }

  steer(f, dt) {
    const cfg = this.cfg, b = f.def.behavior, reef = this.reef;
    const [F, tmp, seek, avoid, sep, terr, wander, school, probe] = this.t;
    const g = this.g;
    const speedMul = cfg.fish.speedMultiplier;

    // state transitions
    if (this.time >= f.stateUntil && f.behaviorState !== 'TURNING' && f.behaviorState !== 'AVOIDING') this.chooseState(f);
    const toT = tmp.subOf(f.targetPosition, f.position);
    let dist = toT.len();
    const arrive = Math.max(0.25, f.bodyLength * 0.8);
    // The speed value stays high when a corner cancels the motion, so the stall is
    // measured from where the fish actually is. Hovering, resting and schooling may
    // hold still; everyone else, and anyone slid along rock, may not.
    const moved = f.position.distTo(f.anchor);
    const settled = f.behaviorState === 'HOVERING' || f.behaviorState === 'RESTING' || f.behaviorState === 'SCHOOLING';
    const pinned = this.againstRock(f);
    if (dist < f.bestDist - 0.05) { f.bestDist = dist; f.stuck = 0; f.anchor.copy(f.position); }
    else if (moved > 0.08 && !pinned) { f.stuck = 0; f.anchor.copy(f.position); }
    else if (dist >= arrive && (!settled || pinned)) f.stuck += dt;
    else f.stuck = Math.max(0, f.stuck - dt);
