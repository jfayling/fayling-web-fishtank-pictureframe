name: Feature request
description: A new species, reef formation, behavior, scene, or other idea
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New fish species
        - Fish behavior
        - Reef, coral or scene
        - Rendering or performance
        - Accessibility
        - Settings, widgets or display
        - Docs or tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the idea. Reference photos or videos of real reef life are very welcome.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What would it add for someone watching the tank, or for someone working on the code?
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself
